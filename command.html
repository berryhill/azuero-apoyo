async function api(url,retried=false){const r=await fetch(url,{credentials:'same-origin',cache:'no-store'});const body=await r.json().catch(()=>({}));if(r.status===401){if(!retried&&await relogin())return api(url,true);showGate();throw Error(body.error||'Entra con tu código para continuar.')}if(!r.ok)throw Error(body.error||`Error HTTP ${r.status} (GET ${url})`);return body}
// Entrada con código como en la página pública (/api/session/code): abre a la vez las sesiones de todos los paneles del
// usuario, así la navegación superior pasa a Runners o Constructores sin volver a pedir el código. Aquí solo entran agentes.
// El código se guarda para reingresar si el servidor se reinicia (la sesión vive en su memoria).
async function startSession(accessCode){const r=await fetch('/api/session/code',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode})});const body=await r.json().catch(()=>({}));if(!r.ok)throw Error(body.error||'No se pudo entrar.');if(!(body.roles||[]).includes('agent'))throw Error('Tu código no tiene acceso al Centro de comando.');window.AppNav?.codeSignedIn(accessCode);localStorage.setItem('agentCode',accessCode);localStorage.setItem('codeUser',JSON.stringify({id:body.id,name:body.name,telephone:body.telephone||'',roles:body.roles||[],panels:body.panels||[]}));for(const p of body.panels||[])if(p.url==='/runner.html'||p.url==='/builder.html'){const who=p.url==='/builder.html'?'builder':'runner';localStorage.setItem(who+'Code',accessCode);localStorage.setItem(who+'Name',body.name)}const s=await fetch('/api/agent/session',{credentials:'same-origin',cache:'no-store'});if(!s.ok)throw Error('No se pudo entrar.');const session=await s.json();signedIn(session);return session}
async function relogin(){const code=localStorage.getItem('agentCode')||localStorage.getItem('runnerCode')||localStorage.getItem('builderCode');if(!code)return false;try{await startSession(code);return true}catch{localStorage.removeItem('agentCode');return false}}
function signedIn(s){csrf=s.csrf;userId=s.id||'';$('#gate').hidden=true;$('#who').hidden=false;$('#whoName').textContent=(window.AppNav?AppNav.shortName(s.name):s.name);$('#whoName').title=s.name;let u=null;try{u=JSON.parse(localStorage.getItem('codeUser')||'null')}catch{}if(!u||u.id&&u.id!==s.id)localStorage.setItem('codeUser',JSON.stringify({id:s.id,name:s.name,roles:['agent']}));window.AppNav?.draw()}
function showGate(){$('#gate').hidden=false;$('#who').hidden=true;window.AppNav?.prefillCode($('#gateForm'));$('#gateForm').elements.accessCode.focus()}
$('#gateForm').onsubmit=async e=>{e.preventDefault();const f=e.target,b=f.querySelector('button'),code=window.AppNav?AppNav.codeOf(f.elements.accessCode.value):f.elements.accessCode.value.trim();$('#gateMessage').textContent='';if(!code){$('#gateMessage').textContent='El centro de comando necesita tu código de acceso.';return}b.disabled=true;try{await startSession(code);await refresh()}catch(err){$('#gateMessage').textContent=err.message}finally{b.disabled=false}};

// Necesidades como fichas con ícono (Agua, Alimentos…); lo demás escrito a mano queda como ficha de texto.

const vb=(x,o)=>typeof PointForm!=='undefined'&&PointForm.verifiedBadge?PointForm.verifiedBadge(x,o):'';function needChips(text,label=''){const pf=typeof PointForm!=='undefined'?PointForm:{},types=pf.NEEDS||[],icons=pf.icons||{};return `<div class="chips">${label?`<span class="needlabel">${label}</span>`:''}${String(text||'').split(/[,\n]+/).map(p=>p.trim()).filter(Boolean).map(part=>{const dc=pf.needChip?pf.needChip(part):'';if(dc)return dc;const hit=types.find(([l])=>foldNeed(l)===foldNeed(part));return hit?`<span class="chip">${icons[hit[1]]||''}${clean(hit[0])}</span>`:`<span class="chip text">${clean(part)}</span>`}).join('')}</div>`}
const needLook={OPEN:['open','Abierta'],IN_PROGRESS:['route','En camino'],COMPLETED:['done','Completada']};
const needsOf=p=>needs.filter(n=>n.campId===p.id&&needLook[n.status]&&n.kind!=='service');

const servicesOf=p=>needs.filter(n=>n.campId===p.id&&n.kind==='service'&&n.status!=='DELETED');

// Teléfonos: tocar copia; al lado, botón de teléfono que abre WhatsApp (nav.js).
const tel=phone=>window.AppNav?AppNav.phone(phone):clean(phone);
// Personas del punto: la lista guardada o, en registros viejos, los tres contactos sueltos.
const peopleOf=p=>p.members?.length?p.members:[['contact','phone'],['secondContact','secondPhone'],['thirdContact','thirdPhone']].filter(([n,t])=>p[n]||p[t]).map(([n,t])=>({name:p[n]||'',phone:p[t]||''}));
const userName=id=>users.find(u=>u.id===id)?.name||'';
// Filtros (más simples que en administración): estado, una ficha de necesidades, área, tipo de necesidad y orden.
// Se recuerdan solo en este navegador; el mapa muestra los mismos puntos que la lista.
// Nombres de equipos (para «Solo equipo X» y el coordinador por defecto); se cargan una vez.
let teamNames=null;
let filt={status:'',who:'',need:'',area:'',type:'',gps:false,sort:'priority'};try{Object.assign(filt,JSON.parse(localStorage.getItem('commandFilters')||'{}'))}catch{}

const pendingNeeds=p=>needsOf(p).filter(n=>n.status!=='COMPLETED');
const needTests={urgent:['Urgentes',p=>pendingNeeds(p).some(n=>n.urgency==='urgente')],OPEN:['Abiertas',p=>needsOf(p).some(n=>n.status==='OPEN')],IN_PROGRESS:['En camino',p=>needsOf(p).some(n=>n.status==='IN_PROGRESS')],repair:['Reparaciones',p=>pendingNeeds(p).some(n=>n.kind==='repair')],none:['Sin pendientes',p=>!pendingNeeds(p).length]};

const rank=p=>needTests.urgent[1](p)?0:p.status==='pending'?1:needTests.OPEN[1](p)?2:3;
// Necesidades: abiertas primero, luego en ruta y completadas; dentro de cada estado, las urgentes arriba.
const needOrder=(a,b)=>Object.keys(needLook).indexOf(a.status)-Object.keys(needLook).indexOf(b.status)||(a.urgency==='urgente'?0:1)-(b.urgency==='urgente'?0:1);
const newest=(a,b)=>String(b.created).localeCompare(String(a.created));
const sorters={priority:(a,b)=>rank(a)-rank(b)||pendingNeeds(b).length-pendingNeeds(a).length||newest(a,b),recent:newest,checkup:(a,b)=>String(a.lastCheckup||'').localeCompare(String(b.lastCheckup||''))||newest(a,b),code:(a,b)=>String(a.code||'').localeCompare(String(b.code||''),'es',{numeric:true}),area:(a,b)=>String(a.area||'').localeCompare(String(b.area||''),'es')||newest(a,b)};
// Base: aprobados y por revisar (sin archivados ni duplicados) que coinciden con la búsqueda y los filtros, salvo «skip».
function filtered(skip){const q=foldNeed($('#search').value);return points.filter(p=>['approved','pending'].includes(p.status)&&(!q||foldNeed(Object.values(p).join(' ')).includes(q))&&(skip==='status'||!filt.status||p.status===filt.status)&&(skip==='who'||!filt.who||whoTests[filt.who]?.(p))&&(skip==='need'||!filt.need||needTests[filt.need]?.[1](p))&&(skip==='area'||!filt.area||(p.area||'').trim()===filt.area)&&(skip==='type'||!filt.type||needTypes(p).has(filt.type))&&(skip==='gps'||!filt.gps||!hasCoords(p)))}
// «Agregado por»: yo (con mi código) o alguien de mi equipo (yo incluido).
const whoTests={me:p=>!!userId&&p.addedBy===userId,team:p=>!!myTeam()&&!!p.addedBy&&users.find(u=>u.id===p.addedBy)?.teamId===myTeam()};

// Cada opción muestra cuántos puntos quedarían al elegirla (con los demás filtros puestos).
const statusLabels={'':'Todos',pending:'Por revisar',approved:'Aprobados'};
function drawFilters(){const forWho=filtered('who'),whoOpts=[['','Todos',''],['me','Míos',icoMeS],...(myTeam()?[['team','Equipo',icoTeamS]]:[])];if(filt.who==='team'&&!myTeam())filt.who='';$('#whoSeg').innerHTML=whoOpts.map(([k,l,i])=>`<button type="button" data-who="${k}" aria-pressed="${filt.who===k}" title="${k?'Agregados por '+(k==='me'?'mí':'mi equipo'):'Todos los puntos'}">${i}${l}<small>${k?forWho.filter(whoTests[k]).length:forWho.length}</small></button>`).join('');const active=[filt.need,filt.area,filt.type,filt.gps].filter(Boolean).length;$('#moreCount').hidden=!active;$('#moreCount').textContent=active;const forStatus=filtered('status');document.querySelectorAll('#filters [data-status]').forEach(b=>{const s=b.dataset.status;b.setAttribute('aria-pressed',String(s===filt.status));b.innerHTML=`${statusLabels[s]}<small>${s?forStatus.filter(p=>p.status===s).length:forStatus.length}</small>`});

const forArea=filtered('area'),areas=[...new Set(points.filter(p=>['approved','pending'].includes(p.status)).map(p=>(p.area||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'es'));$('#areaFilter').innerHTML=`<option value="">Todas las áreas</option>${areas.map(a=>`<option value="${clean(a)}"${a===filt.area?' selected':''}>${clean(a)} (${forArea.filter(p=>(p.area||'').trim()===a).length})</option>`).join('')}`;
