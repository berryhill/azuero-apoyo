.ctlrow{display:flex;align-items:center;gap:10px;margin:6px 0 8px;flex-wrap:wrap}.cpick{position:relative;flex:0 1 auto;min-width:0}.cbtn{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:8px 12px;border:1px solid #cad9d9;border-radius:999px;background:#fff;color:#173c46;font:inherit;font-size:14px;font-weight:800;cursor:pointer}.cbtn .cname{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.cbtn .chev{font-size:11px;opacity:.7}.cbtn.empty{border-color:#ed7654;background:#fff4ef;color:#a83c1f}.cpop{position:absolute;z-index:1200;top:calc(100% + 6px);left:0;width:min(320px,calc(92vw / var(--text-zoom,1)));padding:8px;border:1px solid #cad9d9;border-radius:12px;background:#fff;box-shadow:0 12px 30px #10263a33}.cpop input{display:block;width:100%;padding:10px;border:1px solid #cad9d9;border-radius:9px;font-size:16px}.clist{max-height:240px;overflow:auto;margin-top:6px}.clist button{display:block;width:100%;padding:11px 10px;border:0;border-radius:8px;background:none;text-align:left;font-size:15px;font-weight:700;color:#173c46;cursor:pointer}.clist button:hover{background:#eef6f3}.clist .cnew{color:#19745f}

<main class="app" id="app" hidden><section class="mapwrap"><div id="map" aria-label="Mapa de pedidos"></div><div class="maphint" id="mapHint">Pedidos sin GPS aparecen solo en la lista.</div></section>
<section class="side"><div class="sidehead"><div class="ctlrow"><div class="cpick"><button type="button" class="cbtn" id="kitchenBtn" aria-haspopup="listbox" aria-expanded="false" title="Tu cocina"></button><div class="cpop" id="kitchenPop" hidden><input id="kitchenInput" maxlength="120" placeholder="Busca o escribe una cocina nueva" autocomplete="off" spellcheck="false" aria-label="Cocina"><div class="clist" id="kitchenList" role="listbox"></div></div></div><label class="tswitch" title="Solo pedidos de mi equipo o de puntos que agregó mi equipo"><input type="checkbox" id="teamOnly"><span class="sw" aria-hidden="true"></span><span>Solo mi equipo</span></label></div><nav class="maintabs" id="mainTabs" role="tablist" aria-label="Pedidos"></nav><p class="msg" id="msg" role="status"></p></div><div class="feed" id="list"><p class="empty">Cargando…</p></div></section></main>

<script src="./leaflet.js"></script><script src="./pointform.js"></script><script src="./nav.js"></script><script>
const $=s=>document.querySelector(s),clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const ago=v=>{const ms=Date.now()-Date.parse(v);if(!v||isNaN(ms))return '';const m=Math.round(ms/6e4);return m<60?`hace ${Math.max(1,m)} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
const at=v=>{const d=new Date(v);if(!v||isNaN(d))return '';const today=new Date().toDateString()===d.toDateString();return (today?'':d.toLocaleDateString('es-PA',{weekday:'short',day:'numeric',month:'short'})+' ')+d.toLocaleTimeString('es-PA',{hour:'numeric',minute:'2-digit'})};
const MEALS={desayuno:'Desayuno',almuerzo:'Almuerzo',cena:'Cena'};
// Platos sugeridos para la lista de empaque (se puede escribir cualquier otro).
const DISHES=['Platos de comida','Arroz con pollo','Sopa','Sándwiches','Bebidas','Frutas'].map(name=>({name}));
let csrf='',data={open:[],mine:[],taken:[],done:[],kitchen:'',kitchens:[]},tab='mine',view='list',runners=null,photoFor=null,map=null,layer=null,teamOnly=false;
try{tab=sessionStorage.getItem('cookTab')||'mine';view=sessionStorage.getItem('cookView')||'list';teamOnly=localStorage.getItem('cookTeamOnly')==='1'}catch{}
if(!['mine','open'].includes(tab))tab='mine';
// Sin sesión de Cocina (p. ej. el rol se agregó después de entrar): se vuelve a entrar con el código recordado, como
// en las demás páginas; si el código no tiene el rol, se muestra el aviso del servidor.
function rememberedCode(){try{return localStorage.getItem('rememberCode')!=='0'&&localStorage.getItem('rememberedCode')||['runnerCode','builderCode','agentCode'].map(k=>localStorage.getItem(k)).find(Boolean)||''}catch{return ''}}
async function relogin(){const code=rememberedCode();if(!code)return false;const r=await fetch('/api/cook/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:code})}).catch(()=>null);if(!r)return false;const b=await r.json().catch(()=>({}));if(!r.ok){$('#gateMsg').textContent=b.error||'';return false}csrf=b.csrf;return true}
async function api(url,method='GET',body,retried=false){const r=await fetch(url,{method,credentials:'same-origin',cache:'no-store',headers:method==='GET'?{}:{'Content-Type':'application/json','X-CSRF-Token':csrf},...(method==='GET'?{}:{body:JSON.stringify(body||{})})});const out=await r.json().catch(()=>({}));if(r.status===401){if(!retried&&await relogin())return api(url,method,body,true);showGate();throw Error('Entra con tu código para continuar.')}if(!r.ok)throw Error(out.error||`Error ${r.status}`);return out}
function showGate(){$('#gateWrap').hidden=false;$('#gate').hidden=false;$('#app').hidden=true;$('#mnav').hidden=true}
function showApp(){$('#gateWrap').hidden=true;$('#app').hidden=false;$('#mnav').hidden=false}
async function start(){const r=await fetch('/api/cook/session',{credentials:'same-origin',cache:'no-store'}).catch(()=>null);if(r&&r.ok){const s=await r.json();csrf=s.csrf;showApp();load();return}if(await relogin()){showApp();load();return}showGate()}
$('#gateForm').onsubmit=async e=>{e.preventDefault();$('#gateMsg').textContent='';try{const r=await fetch('/api/cook/session',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:e.target.accessCode.value})});const b=await r.json().catch(()=>({}));if(!r.ok)throw Error(b.error||'No se pudo entrar.');csrf=b.csrf;try{localStorage.setItem('codeUser',JSON.stringify({id:b.id,name:b.name,telephone:b.telephone,roles:b.roles,panels:b.panels}))}catch{}window.AppNav?.draw();showApp();load()}catch(err){$('#gateMsg').textContent=err.message}};
async function load(){try{data=await api('/api/cook/tickets');draw()}catch(err){$('#msg').textContent=err.message}}
const TABS=[['mine','🍳','Preparando'],['open','🍲','Pedidos']];
// «Solo mi equipo»: pedidos de alguien de mi equipo o de puntos que agregó mi equipo (Mis comidas siempre se ven).
const shown=k=>[...(data[k]||[]),...(k==='open'?data.needs||[]:[])].filter(t=>k==='mine'||!teamOnly||t.team);
function title(t){const c=t.camp;return clean([c.area,c.place].filter(Boolean).join(' · ')||c.code)}
function maps(t){const c=t.camp;const u=Array.isArray(c.coords)&&c.coords.length===2?`https://www.google.com/maps/search/?api=1&query=${c.coords.join(',')}`:c.gps||'';return u?`<a class="btn ghost small" target="_blank" rel="noopener noreferrer" href="${clean(u)}">Maps ↗</a>`:''}
function head(t){return `<div class="mt"><h2>${title(t)}</h2>${maps(t)}</div><div class="qty">🍲 <b>${clean(t.people)}</b> personas · ${clean(MEALS[t.meal]||t.meal)}</div><p class="meta">Pedido ${clean(ago(t.createdAt))}${t.requestedBy?` por ${clean(t.requestedBy)}`:''}${t.camp.people?` · el punto tiene ${clean(t.camp.people)} personas`:''}</p>`}
function runsHtml(t){const live=(t.runs||[]);const inv=(t.invited||[]);if(!live.length&&!inv.length)return '';return `<ul class="runs">${live.map(r=>`<li>🏃 <b>${clean(r.runnerName)}</b> <span class="st">${r.status==='COMPLETED'?'✓ Entregó':'En camino'}</span>${r.photos?` · 📷 ${r.photos}`:''}</li>`).join('')}${inv.map(n=>`<li>⏳ <b>${clean(n)}</b> <span class="st wait">Esperando que acepte</span></li>`).join('')}</ul>`}
function mineCard(t){const id=clean(t.id),inWay=(t.runs||[]).some(r=>r.status==='IN_PROGRESS'),any=(t.runs||[]).length>0,def=t.pickupAt?new Date(t.pickupAt):new Date(Date.now()+3600e3),hh=String(def.getHours()).padStart(2,'0')+':'+String(def.getMinutes()).padStart(2,'0');
return `<article class="card" data-ticket="${id}">${head(t)}
<div class="box"><h3>🍽️ Platos (lista de empaque, opcional)</h3>${(t.packing||[]).length?PointForm.packingHtml(t.packing):'<p class="meta">Sin platos anotados.</p>'}<button class="btn ghost small" type="button" data-pack="${id}">+ Agregar platos</button></div>
<div class="box"><h3>📷 Foto de partida</h3>${(t.media||[]).length?`<div class="pf-thumbs">${PointForm.mediaThumbs(t.media,m=>'/api/cook/media/'+encodeURIComponent(t.id)+'/'+encodeURIComponent(m.id))}</div>`:''}<button class="btn ghost small" type="button" data-photo="${id}">📷 Agregar foto</button> <span class="meta" id="up-${id}"></span></div>
<div class="box"><h3>🚚 Conductores</h3>${t.driversAskedAt?`<p class="meta"><span class="st ask">🔔 Pidiendo conductores</span> recoger a las <b>${clean(at(t.pickupAt))}</b> <button class="btn quiet small" type="button" data-close="${id}">Dejar de pedir</button></p>`:''}${runsHtml(t)}
<div class="row"><label>Recoger a las <input type="time" data-time="${id}" value="${hh}"></label><button class="btn take" type="button" data-ask="${id}">📣 Pedir conductores</button></div>
<div class="row" style="margin-top:8px"><span class="rpick"><input type="search" data-rfind="${id}" placeholder="Runner: escribe 2 letras…" autocomplete="off" aria-label="Buscar runner"><input type="hidden" data-runner="${id}"><span class="rpick-list" data-rlist="${id}"></span></span><button class="btn ghost" type="button" data-invite="${id}">Asignar</button></div>
<p class="meta">El runner tiene que aceptarlo para confirmarlo. Puedes tener varios runners.</p></div>
<div class="box row">${any?'':`<button class="btn quiet small" type="button" data-release="${id}">Soltar pedido</button>`}${inWay?'<span class="meta">Se completa sola cuando entregue el último runner.</span>':`<button class="btn" type="button" data-done="${id}">✓ Terminar</button>`}</div></article>`}
function openCard(t){return t.fromNeed?`<article class="card"><div class="mt"><h2>${title(t)}</h2>${maps(t)}</div><div class="qty">🍲 ${PointForm.needChipsHtml?PointForm.needChipsHtml(t.need):clean(t.need)}</div><p class="meta">Necesidad del punto ${clean(ago(t.createdAt))}${t.camp.people?` · el punto tiene ${clean(t.camp.people)} personas`:''}</p><div class="row"><button class="btn take" type="button" data-take-need="${clean(t.id)}" data-people="${clean(t.people||'')}">🍳 Tomar este pedido</button></div></article>`:`<article class="card">${head(t)}<div class="row"><button class="btn take" type="button" data-take="${clean(t.id)}">🍳 Tomar este pedido</button></div></article>`}
function takenCard(t){return `<article class="card">${head(t)}<p class="meta">🍳 La tiene <b>${clean(t.cookName||'otra cocina')}</b>${t.kitchen?` · <span class="kitchen">${clean(t.kitchen)}</span>`:''} ${clean(ago(t.takenAt))}${t.pickupAt?` · recogida ${clean(at(t.pickupAt))}`:''}</p>${runsHtml(t)}</article>`}
function doneCard(t){return `<article class="card">${head(t)}<p class="meta">✓ Completado ${clean(ago(t.completedAt))}</p>${runsHtml(t)}</article>`}
// Como Supply: en la computadora el mapa a la izquierda y la lista a la derecha (el reloj al final de las pestañas abre el
// historial); en el teléfono «Lista / Mapa» y el reloj.
const phoneQ=matchMedia('(max-width:760px)');
function draw(){const phone=phoneQ.matches;document.body.classList.toggle('in-hist',view==='hist');document.body.classList.toggle('mobile-list',view!=='map');document.body.classList.toggle('mobile-map',view==='map');drawKitchen();$('#teamOnly').checked=teamOnly;
$('#mainTabs').innerHTML=TABS.map(([k,i,l])=>`<button type="button" role="tab" data-tab="${k}" class="${view!=='hist'&&tab===k?'active':''}" aria-selected="${view!=='hist'&&tab===k}"><span aria-hidden="true">${i}</span> ${l} <b>${shown(k).length}</b></button>`).join('')+`<button type="button" class="histtab${view==='hist'?' active':''}" data-view="hist" title="Historial" aria-label="Historial"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/><path d="M12 7v5l3 2"/></svg></button>`;
document.querySelectorAll('#mnav [data-view]').forEach(b=>b.classList.toggle('active',b.dataset.view===view));
const k=view==='hist'?'done':tab,list=shown(k),card={mine:mineCard,open:openCard,done:doneCard}[k];
$('#list').innerHTML=(view==='hist'?'<h3 class="histh">🕓 Historial · comidas que completaste (7 días)</h3>':'')+(list.length?list.map(card).join(''):`<p class="empty">${{mine:'No tienes comidas en preparación. Toma una en «Pedidos».',open:teamOnly?'Tu equipo no tiene pedidos de comida ahora.':'No hay pedidos de comida ahora.',done:'Todavía no completaste comidas esta semana.'}[k]}</p>`);if(!phone||view==='map')drawMap(list)}
phoneQ.addEventListener('change',()=>{if(!phoneQ.matches&&view==='map')view='list';draw()});
// Mapa: los pedidos de la pestaña abierta (los que no tienen GPS solo en la lista).
function drawMap(list){if(typeof L==='undefined'){$('#mapHint').textContent='Mapa no disponible sin conexión.';return}if($('#app').hidden)return;if(!map){map=L.map('map').setView([7.46,-80.33],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}setTimeout(()=>map.invalidateSize(),30);layer.clearLayers();const pts=list.filter(t=>Array.isArray(t.camp.coords)&&t.camp.coords.length===2);
pts.forEach(t=>L.circleMarker(t.camp.coords,{radius:9,weight:2,color:'#fff',fillColor:t.status==='OPEN'?'#ed7654':t.status==='COMPLETED'?'#7a8d94':'#19745f',fillOpacity:1}).bindPopup(`<b>${title(t)}</b><br>🍲 ${clean(t.people)} · ${clean(MEALS[t.meal]||t.meal)}`).addTo(layer));
if(pts.length)map.fitBounds(L.latLngBounds(pts.map(t=>t.camp.coords)).pad(.2),{maxZoom:14});const miss=list.length-pts.length;$('#mapHint').textContent=`${pts.length} en el mapa${miss?` · ${miss} sin GPS: solo en la lista`:''}`}
// Cocina donde preparas: lista compartida (como los centros de acopio); se elige o se escribe una nueva.
function drawKitchen(){const b=$('#kitchenBtn');b.classList.toggle('empty',!data.kitchen);b.innerHTML=`<span aria-hidden="true">🍳</span><span class="cname">${clean(data.kitchen||'Elige tu cocina')}</span><span class="chev">▾</span>`}
function drawKitchenList(){const q=$('#kitchenInput').value.trim(),f=v=>String(v).normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase(),hits=(data.kitchens||[]).filter(k=>!q||f(k).includes(f(q)));$('#kitchenList').innerHTML=hits.map(k=>`<button type="button" data-kitchen="${clean(k)}">${clean(k)}</button>`).join('')+(q&&!hits.some(k=>f(k)===f(q))?`<button type="button" class="cnew" data-kitchen="${clean(q)}">＋ Usar «${clean(q)}» (cocina nueva)</button>`:'')}
$('#kitchenBtn').onclick=e=>{e.stopPropagation();const p=$('#kitchenPop'),open=p.hidden;p.hidden=!open;$('#kitchenBtn').setAttribute('aria-expanded',String(open));if(open){$('#kitchenInput').value='';drawKitchenList();$('#kitchenInput').focus()}};
$('#kitchenInput').oninput=drawKitchenList;
// Elegir runner: no se listan todos; aparecen al escribir al menos 2 letras. Al elegir, su ID queda en [data-runner].
const rFold=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
document.addEventListener('input',e=>{const i=e.target.closest('[data-rfind]');if(!i)return;const id=i.dataset.rfind,q=rFold(i.value).trim(),box=document.querySelector(`[data-rlist="${CSS.escape(id)}"]`);document.querySelector(`[data-runner="${CSS.escape(id)}"]`).value='';if(q.length<2){box.innerHTML='';return}const hits=(runners||[]).filter(r=>rFold(r.name).includes(q)).slice(0,8);box.innerHTML=hits.length?hits.map(r=>`<button type="button" data-rpick="${clean(r.id)}" data-rfor="${clean(id)}">${clean(r.name)}${r.team?` <small>${clean(r.team)}</small>`:''}</button>`).join(''):'<span class="rpick-none">Ningún runner coincide.</span>'});
document.addEventListener('click',e=>{const b=e.target.closest('[data-rpick]');if(!b)return;const id=b.dataset.rfor,r=(runners||[]).find(x=>x.id===b.dataset.rpick);document.querySelector(`[data-runner="${CSS.escape(id)}"]`).value=b.dataset.rpick;document.querySelector(`[data-rfind="${CSS.escape(id)}"]`).value=r?.name||'';document.querySelector(`[data-rlist="${CSS.escape(id)}"]`).innerHTML=''});
$('#kitchenInput').onkeydown=e=>{if(e.key==='Escape'){$('#kitchenPop').hidden=true;return}if(e.key!=='Enter')return;e.preventDefault();const b=$('#kitchenList [data-kitchen]');if(b)b.click()};
$('#kitchenPop').addEventListener('click',async e=>{const b=e.target.closest('[data-kitchen]');if(!b)return;$('#kitchenPop').hidden=true;try{await api('/api/cook/kitchen','POST',{kitchen:b.dataset.kitchen});await load();$('#msg').textContent='Cocina guardada: los runners la ven al recoger.';$('#msg').classList.add('ok')}catch(err){$('#msg').textContent=err.message}});
document.addEventListener('click',e=>{if(!e.target.closest('.cpick'))$('#kitchenPop').hidden=true});
$('#teamOnly').onchange=e=>{teamOnly=e.target.checked;try{localStorage.setItem('cookTeamOnly',teamOnly?'1':'0')}catch{}draw()};
// Necesidad común de comida preparada: antes de tomarla, para cuántas personas y qué comida.
function askMeal(people){return new Promise(res=>{let d=document.getElementById('mealAsk');if(!d){d=document.createElement('dialog');d.id='mealAsk';d.className='mealask';document.body.appendChild(d)}d.innerHTML=`<form method="dialog"><h2>🍳 Tomar este pedido</h2><label>¿Para cuántas personas?<input name="people" type="number" min="1" max="5000" inputmode="numeric" required value="${clean(people)}"></label><fieldset class="mealpick"><legend>¿Qué comida?</legend>${[['desayuno','🍳 Desayuno'],['almuerzo','🍛 Almuerzo'],['cena','🍲 Cena']].map(([v,l])=>`<label><input type="radio" name="meal" value="${v}" required> ${l}</label>`).join('')}</fieldset><div class="row"><button type="button" class="btn ghost" value="no">Cancelar</button><button type="submit" class="btn take">Tomar</button></div></form>`;const f=d.querySelector('form');f.querySelector('[value=no]').onclick=()=>{d.close();res(null)};f.onsubmit=e=>{e.preventDefault();const p=parseInt(f.people.value,10),m=f.meal.value;if(!(p>0)||!m)return;d.close();res({people:p,meal:m})};d.showModal()})}
async function act(id,path,body,okText){$('#msg').textContent='';$('#msg').classList.remove('ok');try{await api('/api/cook/tickets/'+encodeURIComponent(id)+path,'POST',body);await load();if(okText){$('#msg').textContent=okText;$('#msg').classList.add('ok')}}catch(err){$('#msg').textContent=err.message}}
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b)return;const d=b.dataset;
if(d.tab){tab=d.tab;if(view==='hist')view='list';try{sessionStorage.setItem('cookTab',tab);sessionStorage.setItem('cookView',view)}catch{}draw();return}
if(d.takeNeed){const id=d.takeNeed,people=await askMeal(d.people);if(!people)return;$('#msg').textContent='';try{await api('/api/cook/needs/'+encodeURIComponent(id)+'/take','POST',people);tab='mine';view='list';await load();$('#msg').textContent='Pedido tomado: está en «Preparando».';$('#msg').classList.add('ok')}catch(err){$('#msg').textContent=err.message}return}
if(d.view){view=d.view==='hist'&&view==='hist'?'list':d.view;try{sessionStorage.setItem('cookView',view)}catch{}draw();return}
if(d.take){await act(d.take,'/take',{},'Pedido tomado: está en «Mis comidas».');tab='mine';view='list';if(!runners)runners=await api('/api/cook/runners').catch(()=>[]);draw();return}
if(d.release){if(!await AppNav.confirm('¿Soltar este pedido?',{yes:'Soltar',no:'Cancelar',detail:'Vuelve a «Pedidos» para otra cocina.'}))return;await act(d.release,'/release',{},'Pedido soltado.');return}
if(d.ask){const t=document.querySelector(`[data-time="${CSS.escape(d.ask)}"]`).value;await act(d.ask,'/drivers',{pickupAt:t},'Pedimos conductores: los runners lo ven en «🍲 Comidas».');return}
if(d.invite){const sel=document.querySelector(`[data-runner="${CSS.escape(d.invite)}"]`),t=document.querySelector(`[data-time="${CSS.escape(d.invite)}"]`).value;if(!sel.value){$('#msg').textContent='Elige un runner.';return}await act(d.invite,'/drivers',{pickupAt:t,runnerId:sel.value},'Listo: el runner tiene que aceptarlo.');return}
if(d.close){await act(d.close,'/drivers/close',{},'Ya no se piden conductores.');return}
if(d.done){if(!await AppNav.confirm('¿Terminar este pedido?',{yes:'Terminar',no:'Cancelar',detail:'Queda anotado en los servicios del punto.'}))return;await act(d.done,'/done',{},'Pedido terminado y anotado en el punto.');return}
if(d.pack){const t=data.mine.find(x=>x.id===d.pack);PointForm.openPacking({subtitle:t?title(t).replace(/&[^;]+;/g,''):'',items:DISHES,save:async lines=>{await api('/api/cook/tickets/'+encodeURIComponent(d.pack)+'/packing','POST',{items:lines});await load()}});return}
if(d.photo){photoFor=d.photo;$('#photoFile').click();return}});
$('#photoFile').onchange=async e=>{const f=e.target.files[0],id=photoFor;e.target.value='';if(!f||!id)return;const st=document.getElementById('up-'+id);try{const file=await PointForm.prepareMedia(f);await PointForm.uploadMedia('/api/cook/tickets/'+encodeURIComponent(id)+'/media?stage=pickup',file,{csrf,onProgress:p=>{if(st)st.textContent=`Subiendo… ${Math.round(p*100)}%`}});await load()}catch(err){if(st)st.textContent='No se pudo subir: '+err.message}};
window.AppNav?.watchAccess('/api/cook/session','/cook.html');
start().then(async()=>{if(csrf){runners=await api('/api/cook/runners').catch(()=>[]);draw()}});
setInterval(()=>{if(csrf&&!document.hidden&&!document.querySelector('dialog[open]')&&!document.activeElement?.matches('input,select'))load()},20000);
</script></body></html>
