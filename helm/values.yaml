replicaCount: 1
image:
  repository: ghcr.io/berryhill/azuero-apoyo
  # Set an immutable build tag or digest; no image is published by this chart.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
service:
  port: 80
containerPort: 8080
ingress:
  # Enable after DNS and TLS issuer are configured.
  enabled: false
  className: nginx
  host: azuero-apoyo.berryhill.dev
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    # Fotos y videos de las carreras se suben a través de la app (hasta MEDIA_MAX_MB, 250 MB por defecto).
    nginx.ingress.kubernetes.io/proxy-body-size: "260m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  tls:
    enabled: true
    secretName: azuero-apoyo-tls
# Reference an existing Secret; never place credential values in Helm values.
existingEnvSecret: ""
# Optional Secret for run photos/videos in object storage, created by an operator (never by CI):
# S3_BUCKET, S3_ACCESS_KEY_ID, S3_SECRET_ACCESS_KEY, and S3_ENDPOINT/S3_REGION for S3-compatible
# providers. If it is missing, the pod still starts and media is stored on the persistent volume.
mediaEnvSecret: ""
# Persistent data volume. A single replica with Recreate avoids multi-attach
# failures on clusters whose default storage class provides ReadWriteOnce disks.
persistence:
  enabled: true
  existingClaim: ""
  mountPath: /data
  size: 1Gi
  accessModes:
    - ReadWriteOnce
  # Empty uses the cluster's default StorageClass.
  storageClassName: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
