replicaCount: 2
image:
  repository: ghcr.io/berryhill/azuero-relief
  # Set an immutable build tag or digest; no image is published by this chart.
  tag: ""
  digest: ""
  pullPolicy: IfNotPresent
imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""
serviceAccount:
  create: true
  name: ""
service:
  port: 80
containerPort: 8080
ingress:
  # Enable after DNS and TLS issuer are configured.
  enabled: false
  className: nginx
  host: ""
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-http
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
  tls:
    enabled: true
    secretName: ""
# Reference an existing Secret; never place credential values in Helm values.
existingEnvSecret: ""
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi
podAnnotations: {}
nodeSelector: {}
tolerations: []
affinity: {}
