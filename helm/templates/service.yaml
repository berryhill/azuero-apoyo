apiVersion: v1
kind: Service
metadata:
  name: {{ include "azuero-relief.fullname" . }}
  labels:
    {{- include "azuero-relief.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
  selector:
    {{- include "azuero-relief.selectorLabels" . | nindent 4 }}
