<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Boletín informativo · Unidos por Azuero</title><style>

.history{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.hcard{background:var(--gray);border-radius:9px;padding:10px 12px}.hcard .top{display:flex;justify-content:space-between;font-size:11.5px;font-weight:700;color:var(--navy)}.hcard .top small{font-weight:400;color:var(--muted);font-size:9.5px}.hbar{height:12px;border-radius:3px;background:#dde3e9;margin:8px 0;display:flex;overflow:hidden}.hbar i{display:block;height:100%}.hcard .nums{display:flex;justify-content:space-between;font-size:11px;font-weight:700}.hcard .nums span:last-child{color:var(--mid)}

<script>
const $=s=>document.querySelector(s);const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=s=>String(s??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const num=n=>String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,'.');const pct=(a,b)=>b?Math.round(a*100/b)+' %':'0 %';
const count=t=>{const m=String(t??'').match(/\d+/);return m?Number(m[0]):null};
// Sectores del manual, de oeste a este; "Sin ubicación" siempre al final.
const SECTORS=[['isla canas','Sigua · El Corral'],['el corral','Sigua · El Corral'],['sigua','Sigua · El Corral'],['rio viejo','Río Viejo'],['el cacao','El Cacao'],['flores','Flores'],['agua buena','Agua Buena'],['ojo de agua','Ojo de Agua'],['canas','Cañas'],['oria arriba','Oria Arriba'],['los asientos','Los Asientos'],['venao','Playa Venao']];
const ORDER=['Río Viejo','El Cacao','Flores','Agua Buena','Sigua · El Corral','Ojo de Agua','Cañas','Oria Arriba','Los Asientos','Playa Venao'];
const NONE='Sin ubicación';
function sector(area){const a=fold(area).trim();if(!a||a.startsWith('sin ubicacion'))return NONE;const hit=SECTORS.find(([k])=>a.includes(k));return hit?hit[1]:String(area).trim()}
const sectorRank=s=>s===NONE?999:ORDER.includes(s)?ORDER.indexOf(s):500;
const TAGS={pressure:/presion|hipertens|indapamida|amlodipino|enalapril|losartan/,pregnancy:/embaraz/,newborn:/recien nacid/,baby:/bebe|formula|\bnan\b|nestum|gemel|panalitis|biberon/,insulin:/insulin/,asthma:/asma|inhalador|montelukast|salbutamol|flixotide/,meds:/medic|acetaminofen|ibuprofeno|paracetamol|jarabe|antigripal|botiquin/,mobility:/silla de ruedas|baston|discapac|impedid/,shelter:/techo|lona|carpa|tienda|toldo|colchon|hamaca|refugio/};
const ASKS=[['Agua',/\bagua\b/],['Alimentos',/aliment|comida|arroz|aceite|azucar|\bcafe\b|pollo|huevo|enlatad|granos|\bpan\b|\bsal\b|viveres/],['Medicamentos',/medic|acetaminofen|ibuprofeno|paracetamol|insulin|inhalador|antigripal|jarabe|botiquin|gasas|desinfect|presion|montelukast|loratadina/],['Colchones o colchonetas',/colchon/],['Leche o fórmula infantil',/leche|formula|klim|\bnido\b|\bnan\b|nestum/],['Pañales (bebé y adulto)',/panal/],['Repelente o mosquitero',/repelente|mosquit/],['Techo, carpas o lonas',/techo|carpa|lona|tienda|toldo|\bzinc\b/],['Higiene personal',/higiene|papel higienico|pasta de diente|cepillo|toallas sanitarias|desodorante|shampoo|champu/],['Platos desechables',/plato|cubierto|vasos/],['Toallitas y crema para bebé',/toallita|crema/],['Limpieza (jabón, cloro, bolsas)',/limpieza|cloro|jabon|bolsas|detergente|desinfect/],['Gas, fogones o estufa',/\bgas\b|tanque|fogon|estufa/],['Sábanas y toallas',/sabana|\btoallas?\b|cobija/],['Ropa y calzado',/\bropa\b|chancleta|zapato|calzado/],['Energía (gasolina, planta)',/gasolina|diesel|generador|planta electrica/]];
const MEDS=[['Insulina',[[/insulin/,'insulina']]],['Presión',[[/indapamida/,'indapamida'],[/amlodipino/,'amlodipino'],[/enalapril/,'enalapril'],[/losartan/,'losartán'],[/presion|hipertens/,'para la presión']]],['Asma',[[/montelukast/,'montelukast'],[/inhalador/,'inhalador'],[/salbutamol/,'salbutamol'],[/flixotide/,'Flixotide']]],['Dolor y fiebre',[[/acetaminofen/,'acetaminofén'],[/paracetamol/,'paracetamol'],[/ibuprofeno/,'ibuprofeno']]],['Alergia',[[/loratadina/,'loratadina'],[/clorfeniramina/,'clorfeniramina'],[/cetirizina/,'cetirizina']]],['Gripe y tos',[[/jarabe/,'jarabe'],[/antigripal/,'antigripal']]],['Diabetes',[[/metformina/,'metformina'],[/glucometro/,'glucómetro']]],['Botiquín',[[/gasas/,'gasas'],[/desinfect/,'desinfectante'],[/curacion/,'curaciones'],[/alcohol/,'alcohol'],[/vendas?\b/,'vendas']]]];
const panama=(iso,opts)=>new Date(iso).toLocaleString('es-PA',{timeZone:'America/Panama',...opts});
const cutLong=iso=>{const d=panama(iso,{weekday:'long',day:'numeric',month:'short',year:'numeric'}).replace(/\./g,'');return d.charAt(0).toUpperCase()+d.slice(1)+' · '+panama(iso,{hour:'2-digit',minute:'2-digit',hour12:false})+' h'};
const cutShort=iso=>panama(iso,{day:'numeric',month:'short'}).replace(/\./g,'')+', '+panama(iso,{hour:'2-digit',minute:'2-digit',hour12:false});
function mapLink(p){if(Array.isArray(p.coords)&&p.coords.length===2)return 'https://maps.google.com/?q='+p.coords.join(',');try{const u=new URL(p.gps);if(u.protocol==='https:'&&/(^|\.)google\.com$|^maps\.app\.goo\.gl$/.test(u.hostname))return u.href}catch{}return ''}
function analyze(b){const recs=b.points.map(p=>{const text=fold([p.needs,p.notes].join(' '));const tags=Object.fromEntries(Object.entries(TAGS).map(([k,re])=>[k,re.test(text)]));return {...p,sector:sector(p.area),n:count(p.people),attended:/^(yes|si|sí)$/i.test(String(p.service||'').trim()),maybe:/^maybe$/i.test(String(p.service||'').trim()),text,needsText:fold(p.needs),tags,link:mapLink(p)}});return recs}
// Prioridad: sin ubicación con salud, recién nacidos y bebés, medicinas con nombre, refugio; luego el resto pendiente.
function priorities(recs){const rows=[];for(const r of recs){const t=r.tags,none=r.sector===NONE;let group=null,tag='';if(r.attended){if(t.insulin)rows.push({r,group:2,tag:'INSULINA',status:'Confirmar',lead:'Pidieron insulina y el punto figura atendido: confirmar que llegó. '});continue}
const health=[['pressure','PRESIÓN'],['pregnancy','EMBARAZO'],['insulin','INSULINA'],['asthma','ASMA'],['newborn','RECIÉN NACIDO'],['baby','BEBÉS'],['mobility','MOVILIDAD'],['meds','MEDICINAS']].find(([k])=>t[k]);
if(none&&health){group=0;tag=health[1]}else if(t.newborn){group=1;tag='RECIÉN NACIDO'}else if(t.baby){group=1;tag='BEBÉS'}else if(t.insulin){group=2;tag='INSULINA'}else if(t.asthma){group=2;tag='ASMA'}else if(t.pressure){group=2;tag='PRESIÓN'}else if(t.meds){group=2;tag='MEDICINAS'}else if(t.shelter){group=3;tag='REFUGIO'}else{group=4;tag=none?'SIN LUGAR':'GENERAL'}
rows.push({r,group,tag,status:r.maybe?'Tal vez':'Pendiente',lead:''})}
return rows.sort((a,b)=>a.group-b.group||(b.r.n||0)-(a.r.n||0)).slice(0,8)}
const short=(s,n)=>{s=String(s||'').replace(/\s+/g,' ').trim();return s.length>n?s.slice(0,n-1).replace(/\s+\S*$/,'')+'…':s};
function bubbleMap(recs){const pts=recs.filter(r=>Array.isArray(r.coords)&&r.coords.length===2);const W=400,H=330,pad=38;if(!pts.length)return `<div class="map" style="padding:40px;text-align:center;color:#6b7785">Ningún punto tiene GPS en este corte.</div>`;
const lats=pts.map(p=>p.coords[0]),lons=pts.map(p=>p.coords[1]);let [minLat,maxLat,minLon,maxLon]=[Math.min(...lats),Math.max(...lats),Math.min(...lons),Math.max(...lons)];const span=Math.max(maxLat-minLat,maxLon-minLon,0.02);const cx=(minLon+maxLon)/2,cy=(minLat+maxLat)/2;const sc=Math.min((W-2*pad)/span,(H-2*pad)/span);
const xy=p=>[W/2+(p.coords[1]-cx)*sc,H/2-(p.coords[0]-cy)*sc+6];const maxN=Math.max(1,...pts.map(p=>p.n||0));
const placed=pts.map(p=>{const [x,y]=xy(p);return {p,x,y,r:6+22*Math.sqrt((p.n||0)/maxN)}});
const groups=[];for(const q of placed){const g=groups.find(g=>Math.hypot(g.x-q.x,g.y-q.y)<16);if(g)g.items.push(q);else groups.push({x:q.x,y:q.y,items:[q]})}
const grid=[1,2,3].map(i=>`<line x1="0" x2="${W}" y1="${i*H/4}" y2="${i*H/4}" stroke="#e3e8ee"/><line y1="0" y2="${H}" x1="${i*W/4}" x2="${i*W/4}" stroke="#e3e8ee"/>`).join('');
const halos=placed.sort((a,b)=>b.r-a.r).map(q=>`<circle cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="${q.r.toFixed(1)}" fill="${q.p.attended?'#1A85DF':'#E0533D'}" fill-opacity=".22"/>`).join('');
const cores=placed.map(q=>`<a href="${clean(q.p.link)}" target="_blank" rel="noopener noreferrer"><title>${clean(q.p.code)} · ${clean(q.p.sector)} · ${q.p.n??'s/d'} personas</title><circle class="core" cx="${q.x.toFixed(1)}" cy="${q.y.toFixed(1)}" r="4.5" fill="${q.p.attended?'#1A85DF':'#E0533D'}" stroke="#fff" stroke-width="1.2"/></a>`).join('');
const labels=groups.map(g=>`<text x="${g.x.toFixed(1)}" y="${(g.y-9).toFixed(1)}" text-anchor="middle" font-size="8.5" font-weight="700" fill="#1d2b3a" paint-order="stroke" stroke="#f3f6fa" stroke-width="3">${clean(g.items.map(q=>q.p.code).join(' · '))}</text>`).join('');
const noGps=recs.length-pts.length;return `<div class="map"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Mapa esquemático de puntos">${grid}<text x="12" y="18" font-size="9" fill="#6b7785">Toca un punto para abrirlo en Google Maps · ${noGps} sin GPS</text>${halos}${cores}${labels}<text x="12" y="${H-10}" font-size="9" fill="#6b7785">Oeste: Tonosí</text><text x="${W-12}" y="${H-10}" font-size="9" fill="#6b7785" text-anchor="end">Este: Pedasí</text></svg></div>`}
function header(b,small){const next=new Date(Date.parse(b.cut)+12*3600e3).toISOString();return `<header class="head ${small?'small':''}"><div><div class="kicker">Boletín informativo N.º ${b.n} · Unidos por Azuero · Registro ciudadano de damnificados</div><h1>Damnificados: corredor Oria a Tonosí</h1>${small?`<div class="subtitle">Corte: ${clean(cutLong(b.cut))} · Próximo: ${clean(panama(next,{weekday:'long',day:'numeric',month:'short'}).replace(/\./g,''))}, ${clean(panama(next,{hour:'2-digit',minute:'2-digit',hour12:false}))} h</div>`:`<div class="subtitle">${clean(b.subtitle)}</div><div class="cut">Corte: ${clean(cutLong(b.cut))} <span class="pill">Próximo corte: ${clean(panama(next,{weekday:'long',day:'numeric',month:'short'}).replace(/\./g,''))}, ${clean(panama(next,{hour:'2-digit',minute:'2-digit',hour12:false}))} h · cada 12 h</span></div>`}</div><div class="logo"><img src="/report/logo.png" alt="Unidos por Azuero"></div></header>`}
const footer=(pg)=>`<footer class="pfoot"><div><b>Unidos por Azuero.</b> <span style="color:#6b7785">Registro ciudadano construido y alimentado por voluntarios.</span></div><span class="pg">Pág. ${pg} de 2</span></footer><div class="stripe"></div>`;
function render(b,history){const recs=analyze(b);const people=recs.reduce((s,r)=>s+(r.n||0),0);const att=recs.filter(r=>r.attended);const pend=recs.filter(r=>!r.attended);const attPeople=att.reduce((s,r)=>s+(r.n||0),0),pendPeople=pend.reduce((s,r)=>s+(r.n||0),0);
const sectors=[...new Set(recs.map(r=>r.sector))].sort((a,b)=>sectorRank(a)-sectorRank(b)||a.localeCompare(b,'es'));const communities=sectors.filter(s=>s!==NONE);
const known=communities.filter(s=>ORDER.includes(s));b.subtitle=`${communities.length} ${communities.length===1?'comunidad':'comunidades'} de Los Santos${known.length>1?` · de ${known[0]} hasta ${known[known.length-1]}`:''}`;
const kids=recs.reduce((s,r)=>s+(count(r.children)||0)+(count(r.babies)||0),0),kidsPlus=recs.some(r=>count(r.children)===null&&count(r.babies)===null);const babies=recs.reduce((s,r)=>s+(count(r.babies)||0),0),babiesPlus=recs.some(r=>count(r.babies)===null&&(r.tags.baby||r.tags.newborn));const pregnant=recs.filter(r=>r.tags.pregnancy).length;
const kidsTxt=kids?num(kids)+(kidsPlus?'+':''):kidsPlus?'s/d':'0',babiesTxt=babies?num(babies)+(babiesPlus?'+':''):babiesPlus?'s/d':'0';const first=history.find(h=>h.n===1);const prev=history.filter(h=>h.n<b.n);
// Qué ha pasado: frases armadas solo con números del corte y del histórico.
const bySector=sectors.map(s=>{const rs=recs.filter(r=>r.sector===s);return {s,rs,att:rs.filter(r=>r.attended).reduce((t,r)=>t+(r.n||0),0),pend:rs.filter(r=>!r.attended).reduce((t,r)=>t+(r.n||0),0)}});
const topPend=bySector.filter(x=>x.pend>0).sort((a,b)=>b.pend-a.pend).slice(0,4);const topSum=topPend.reduce((t,x)=>t+x.pend,0);
let lead=prev.length&&first?`<b>Qué ha pasado.</b> En ${b.n} cortes el registro ${first.people===people?`se mantiene en <b>${num(people)} personas</b>`:`pasó de <b>${num(first.people)} a ${num(people)} personas</b>`} y ${first.records===recs.length?`en ${recs.length} registros`:`de ${first.records} a ${recs.length} registros`}. `:`<b>Qué ha pasado.</b> Este corte registra <b>${num(people)} personas</b> en ${recs.length} registros. `;
lead+=`A este corte, <b>${num(attPeople)} personas (${pct(attPeople,people)}) figuran atendidas</b>. `;if(topPend.length)lead+=`Lo pendiente se concentra en ${topPend.map(x=>x.s).join(', ').replace(/, ([^,]*)$/,' y $1')}: suman <b>${num(topSum)} de las ${num(pendPeople)} personas</b> que esperan ayuda.`;else lead+='No hay personas registradas esperando ayuda.';
const maxSec=Math.max(1,...bySector.map(x=>x.att+x.pend));

const page1=`<section class="page">${header(b)}<div class="body"><p class="lead">${lead}</p><div class="cards"><div class="card"><b>${num(people)}</b><span>personas registradas</span><small>${first&&b.n>1?`${people-first.people>=0?'+':''}${num(people-first.people)} desde el boletín 1`:'primer corte'}</small></div><div class="card mid"><b>${recs.length}</b><span>registros</span><small>en ${communities.length} ${communities.length===1?'comunidad':'comunidades'}</small></div><div class="card mid"><b>${num(attPeople)}</b><span>personas atendidas</span><small>${pct(attPeople,people)} · ${att.length} puntos</small></div><div class="card coral"><b>${num(pendPeople)}</b><span>esperan ayuda</span><small>${pend.length} registros pendientes</small></div><div class="card coral"><b>${kidsTxt}</b><span>niños, ${babiesTxt} bebés</span><small>${pregnant?`más ${pregnant} con embarazo mencionado`:'sin embarazos mencionados'}</small></div></div>
<div class="two"><div class="bars"><h2>Personas por comunidad y estado de atención</h2>${secBars}<div class="legend"><span>Atendido</span><span class="p">Esperan ayuda o por confirmar</span></div>${secNote?`<p class="foot">${clean(secNote)}</p>`:''}</div><div><h2>Dónde están y quién ya fue atendido</h2>${bubbleMap(recs)}<div class="legend"><span class="dot">Atendido</span><span class="p dot">Esperan ayuda o por confirmar</span></div></div></div>
${priRows?`<div class="priority"><h2>Prioridad para las próximas 12 horas</h2>${priRows}</div>`:''}</div>${footer(1)}</section>`;
const hist=history.filter(h=>h.n<=b.n).slice(-4);const hmax=Math.max(1,...hist.map(h=>h.people));
const histCards=hist.map(h=>`<div class="hcard"><div class="top">Boletín ${h.n}<small>${clean(cutShort(h.cut))}</small></div><div class="hbar" style="width:${h.people/hmax*100}%"><i style="width:${h.people?h.attended/h.people*100:0}%;background:#1A85DF"></i><i style="flex:1;background:#E0533D"></i></div><div class="nums"><span>${num(h.people)} reg.</span><span>${num(h.attended)} atendidas</span></div></div>`).join('');
const asks=ASKS.map(([label,re])=>{const rs=recs.filter(r=>re.test(r.needsText));return {label,rs,people:rs.reduce((t,r)=>t+(r.n||0),0)}}).filter(x=>x.rs.length).sort((a,b)=>b.rs.length-a.rs.length||b.people-a.people).slice(0,14);const amax=Math.max(1,...asks.map(x=>x.people));const ticksN=Math.min(recs.length,26);

const sumCol=k=>recs.reduce((t,r)=>t+(count(r[k])||0),0);const mention=re=>recs.filter(r=>re.test(r.text)).length;

const care=[[kidsTxt,'niños registrados (incluye bebés)',kids],[babiesTxt,`bebés${newborn?`, ${newborn} ${newborn===1?'registro menciona':'registros mencionan'} un recién nacido`:''}`,babies||babiesPlus],[pregnant,`${pregnant===1?'registro menciona':'registros mencionan'} embarazo`,pregnant],disabled?[`${num(disabled)}${mobilityText?'+':''}`,'con discapacidad o movilidad reducida (silla de ruedas, bastón)',true]:[mobilityText,`${mobilityText===1?'registro menciona':'registros mencionan'} silla de ruedas, bastón o discapacidad`,mobilityText],older?[`${num(older)}${olderText?'+':''}`,'adultos mayores declarados',true]:[olderText,`${olderText===1?'registro menciona':'registros mencionan'} adultos mayores`,olderText],[special,`${special===1?'registro menciona':'registros mencionan'} necesidades especiales`,special]].filter(x=>x[2]).map(([v,l])=>`<div class="care"><b>${clean(v)}</b><span>${clean(l)}</span></div>`).join('')||'<p class="foot">Ningún registro declara cuidados especiales.</p>';
const meds=MEDS.map(([label,terms])=>{const found=terms.filter(([re])=>recs.some(r=>re.test(r.text))).map(([,name])=>name);const rs=recs.filter(r=>terms.some(([re])=>re.test(r.text)));return {label,found,rs}}).filter(x=>x.rs.length);
const medRows=meds.map(x=>`<div class="med"><b>${clean(x.found.length===1&&fold(x.found[0])===fold(x.label)?x.label:x.label+': '+x.found.join(', '))}</b><span>${x.rs.length>3?`${x.rs.length} registros`:clean(x.rs.map(r=>r.code||'s/c').join(', '))}</span></div>`).join('')||'<p class="foot">Ningún registro pide medicinas por nombre.</p>';
const page2=`<section class="page">${header(b,true)}<div class="body">${hist.length>1?`<h2>Cómo ha avanzado la respuesta</h2><div class="history">${histCards}</div>`:''}<h2>Qué piden · cuántos registros lo piden y cuántas personas hay en ellos</h2><div class="asks">${askRows||'<p class="foot">Ningún registro declara necesidades en este corte.</p>'}${askRows?`<div class="axis"><span></span><span style="grid-column:2/4">registros que lo piden (de ${recs.length})</span><span>personas en esos registros</span></div>`:''}</div>
<div class="boxes"><div class="box"><h2>Quiénes necesitan cuidado especial</h2>${care}</div><div class="box coral"><h2>Medicinas que piden por nombre</h2>${medRows}</div></div>
${b.donor?`<div class="donor"><h2>Para quien dona</h2>${clean(b.donor)}</div>`:''}

<p class="source">Fuente única: registro ciudadano de Azuero Apoyo, corte ${clean(cutShort(b.cut))} h (hora de Panamá). Solo puntos aprobados. Conteos tal como los reporta cada punto.</p></div>${footer(2)}</section>`;
$('#root').innerHTML=page1+page2;document.title=`Boletín N.º ${b.n} · Unidos por Azuero`;$('#which').textContent=`Boletín N.º ${b.n}`}
(async()=>{try{const want=new URLSearchParams(location.search).get('n')||'latest';const [hr,br]=await Promise.all([fetch('/api/boletines',{cache:'no-store'}),fetch('/api/boletines/'+encodeURIComponent(want),{cache:'no-store'})]);const history=hr.ok?await hr.json():[];const b=await br.json();if(!br.ok)throw Error(b.error||'No se pudo cargar el boletín.');
