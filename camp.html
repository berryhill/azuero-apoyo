<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ficha del punto · Azuero</title><style>
*{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#173542;font:16px system-ui,-apple-system,sans-serif}header{background:#10263a;color:white;padding:17px 24px;font-weight:800}header a{color:white;text-decoration:none}main{max-width:850px;margin:25px auto;padding:0 18px}article{background:white;padding:24px;border:1px solid #dce5e4;border-radius:14px}h1{margin:5px 0;font-size:29px}h2{font-size:17px;margin:22px 0 8px}p{line-height:1.55;overflow-wrap:anywhere}small,.muted{color:#647983}.badge{display:inline-block;padding:5px 10px;border-radius:20px;background:#eaf4ed;color:#28704d;font-size:12px;font-weight:750}.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:14px;margin:20px 0}.field b{display:block;color:#647983;font-size:12px;margin-bottom:4px}.field span,.bodytext{white-space:pre-line;overflow-wrap:anywhere;line-height:1.55}.bodytext{margin:0}.maplink{display:inline-block;padding:11px 14px;background:#19745f;color:white;text-decoration:none;border-radius:8px;font-weight:700}.notice{background:#fff5e8;padding:12px;border-radius:9px;color:#76572d;font-size:13px}@media(max-width:600px){main{margin:15px auto}article{padding:17px}}
</style></head><body><header><a href="/">← AZUERO / APOYO</a></header><main><article id="camp"><h1>Ficha del punto</h1><p class="muted">Cargando datos del registro…</p></article></main><script>
const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function locationLink(coords){const point=encodeURIComponent(coords.join(','));const apple=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return apple?{url:`https://maps.apple.com/?q=${point}`,label:'Abrir en Apple Maps ↗'}:{url:`https://www.google.com/maps/search/?api=1&query=${point}`,label:'Abrir en Google Maps ↗'}}
function campLocationLink(p){if(Array.isArray(p.coords)&&p.coords.length===2)return locationLink(p.coords);if(p.gps)try{const url=new URL(p.gps);if(url.protocol==='https:'&&['maps.google.com','www.google.com','google.com','maps.app.goo.gl'].includes(url.hostname))return {url:url.href,label:'Abrir en Google Maps ↗'}}catch{}const place=[p.place,p.area,'Panamá'].filter(Boolean).join(', ');if(!p.place&&!p.area)return null;const query=encodeURIComponent(place);const apple=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);return {url:apple?`https://maps.apple.com/?q=${query}`:`https://www.google.com/maps/search/?api=1&query=${query}`,label:apple?'Buscar referencia en Apple Maps ↗':'Buscar referencia en Google Maps ↗',approximate:true}}
async function loadPublicNeeds(id){const section=document.querySelector('#serviceNeeds');try{const res=await fetch('/api/camps/'+encodeURIComponent(id)+'/needs',{cache:'no-store'});if(!res.ok)throw Error('No se pudieron cargar las necesidades de servicio.');const needs=await res.json();section.innerHTML='<h2>Necesidades de servicio</h2>'+(needs.length?needs.filter(n=>n.status!=='DELETED').map(n=>`<div class="service-need"><b>${clean(n.urgency)} · ${clean(({OPEN:'Abierta',IN_PROGRESS:'En curso',COMPLETED:'Completada'})[n.status]||n.status)}</b><p class="bodytext">${clean(n.need)}</p>${n.requesterName?`<p class="muted">Reportado por ${clean(n.requesterName)}${n.requesterPhone?` · <a href="tel:${clean(n.requesterPhone.replace(/[^\d+]/g,''))}">${clean(n.requesterPhone)}</a>`:''}</p>`:''}</div>`).join(''):'<p class="muted">Sin necesidades de servicio registradas.</p>')}catch(err){section.innerHTML='<h2>Necesidades de servicio</h2><p class="muted">'+clean(err.message)+'</p>'}}
async function loadCamp(){const id=new URLSearchParams(location.search).get('id');const root=document.querySelector('#camp');if(!id){root.innerHTML='<h1>Ficha del punto</h1><p>Enlace incompleto. Solicita un enlace nuevo al administrador.</p>';return}try{const response=await fetch('/api/points',{cache:'no-store'});if(!response.ok)throw Error('El registro no está disponible ahora. Inténtalo de nuevo.');const points=await response.json();const p=points.find(row=>row.id===id&&row.status==='approved');if(!p){root.innerHTML='<h1>Ficha no disponible</h1><p>El punto no está aprobado o fue archivado. Consulta el registro actualizado.</p><a href="/">Volver al mapa</a>';return}document.title=`${p.code} · Ficha del punto · Azuero`;const mapLink=campLocationLink(p);const fields={Zona:p.area,'Ubicación / referencia':p.place,Coordinador:p.coordinator,Personas:p.people,Adultos:p.adults,Niños:p.children,Bebés:p.babies,'Adultos mayores':p.olderAdults,Discapacidad:p.disabled,Generador:p.generator,'N.º fila':p.row,Orden:p.ordinal,'Enlace GPS':p.gps,'Fecha del reporte':p.created,'Fecha de aprobación':p.decided};root.innerHTML=`<small>Registro público · punto aprobado</small><h1>${clean(p.code)}</h1><span class="badge">${clean(({NO_NEEDS:'Sin necesidades de servicio',OPEN:'Abierto',IN_PROGRESS:'En curso',COMPLETED:'Completado'})[p.campStatus]||'Estado sin confirmar')}</span> ${p.highestUrgency?`<span class="badge">${clean(p.highestUrgency)}</span>`:''} <span class="badge">${clean(p.service==='YES'?'Servicio reportado':p.service==='MAYBE'?'Servicio incierto':'Servicio sin confirmar')}</span><div class="fields">${Object.entries(fields).map(([k,v])=>`<div class="field"><b>${k}</b><span>${clean(v||'Sin registrar')}</span></div>`).join('')}</div><h2>Necesidades del campamento</h2><p class="bodytext">${clean(p.needs||'Sin necesidades registradas')}</p>${[['Notas del grupo',p.notes],['Indicaciones de llegada',p.directions],['Notas de servicio',p.serviceNotes],['Otras notas',p.extra]].map(([k,v])=>`<h2>${k}</h2><p class="bodytext">${clean(v||'Sin registrar')}</p>`).join('')}<section id="serviceNeeds"><h2>Necesidades de servicio</h2><p class="muted">Cargando…</p></section>${mapLink?`<a class="maplink" target="_blank" rel="noopener noreferrer" href="${clean(mapLink.url)}">${clean(mapLink.label)}</a>${mapLink.approximate?'<p>Sin GPS: la búsqueda es aproximada. Confirma la ubicación antes de salir.</p>':''}`:'<p>Sin GPS: confirma la ubicación antes de salir.</p>'}<p class="notice">Estos son datos reportados, no una entrega verificada. Los contactos privados solo están disponibles para el equipo de curación.</p><a href="/">← Volver al mapa</a>`;loadPublicNeeds(id)}catch(err){root.innerHTML=`<h1>No se pudo abrir la ficha</h1><p>${clean(err.message)}</p>`}}
loadCamp();
</script></body></html>
