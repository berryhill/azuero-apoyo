const media=e.target.closest('[data-media]');if(media){mediaTarget=media.dataset.media;$('#pickDialog').showModal();return}
const dis=e.target.closest('[data-dispatch]');if(dis){const n=findNeed(dis.dataset.dispatch);if(!n)return;const what=String(n.need||'').split(/[,\n]+/).map(x=>x.trim()).filter(Boolean),packed=(n.packing||[]).length;if(await AppNav.choose('¿Sale del acopio esta carrera?',{detail:`${n.runnerName||'Corredor'} → ${[n.camp.area||n.camp.place,n.camp.code].filter(Boolean).join(' · ')}${what.length?` — ${what.slice(0,4).join(', ')}${what.length>4?` y ${what.length-4} más`:''}`:''}${packed?'':' · Todavía sin lista de empaque.'}`,options:[['go','🚚 Sí, despachada','go'],['no','Cancelar','']]})!=='go')return;dis.disabled=true;try{await api('/api/supplier/needs/'+encodeURIComponent(n.id)+'/dispatch','POST',{});await refresh();flash(`Despachada: ${n.runnerName||'la carrera'} sale hacia ${n.camp.area||n.camp.code}.`);render()}catch(err){flash(err.message);await refresh()}return}
const req=e.target.closest('[data-request]');if(req){const n=findNeed(req.dataset.request);if(!n)return;if(!center&&!await AppNav.confirm('¿Pedir sin nombre de centro?',{yes:'Sí, pedir',no:'Escribir el centro',detail:'Los corredores verán tu nombre y teléfono, pero no dónde recoger. Puedes escribirlo arriba en «📍 Centro de acopio».'})){$('#centerInput').focus();return}req.disabled=true;try{await api('/api/supplier/needs/'+encodeURIComponent(n.id)+'/request','POST',{});await refresh();flash(`Pedido enviado: los corredores lo ven en «📣 Pedidos». Cuando uno acepte, pasa a «Por despachar».`);render()}catch(err){flash(err.message);await refresh()}return}
const creq=e.target.closest('[data-cancelreq]');if(creq){if(!await AppNav.confirm('¿Cancelar el pedido de corredor?',{yes:'Sí, cancelar',detail:'Deja de aparecer en «Pedidos» de los corredores.'}))return;try{await api('/api/supplier/needs/'+encodeURIComponent(creq.dataset.cancelreq)+'/request','POST',{cancel:true});await refresh();flash('Pedido cancelado.');render()}catch(err){flash(err.message);await refresh()}return}
const asg=e.target.closest('[data-assign]');if(asg){openAssign(asg.dataset.assign);return}
const undo=e.target.closest('[data-undo]');if(undo){if(!await AppNav.confirm('¿Deshacer «Despachada»?',{yes:'Sí, deshacer',detail:'Vuelve a «Por despachar».'}))return;try{await api('/api/supplier/needs/'+encodeURIComponent(undo.dataset.undo)+'/dispatch','POST',{undo:true});mainTab='todo';highlightNeed=undo.dataset.undo;await refresh();flash('Volvió a «Por despachar».');render()}catch(err){flash(err.message);await refresh()}}};
async function openPacking(id){const n=findNeed(id);if(!n)return;let items;try{items=await api('/api/supplier/packing-items')}catch(err){flash(err.message);render();return}PointForm.openPacking({subtitle:`${n.runnerName?n.runnerName+' · ':''}${n.camp.code} · ${n.camp.area}`,items,save:async lines=>{await api('/api/supplier/needs/'+encodeURIComponent(n.id)+'/packing','POST',{items:lines});await refresh();flash(`Lista de empaque guardada (${lines.length} ${lines.length===1?'artículo':'artículos'}).`);render()}})}
function pickFiles(id){return new Promise(resolve=>{const input=document.getElementById(id);input.value='';input.onchange=()=>resolve([...input.files]);input.click()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const files=pickFiles(b.dataset.pick),target=mediaTarget;$('#pickDialog').close();files.then(f=>{if(target&&f.length)uploadPickup(target,f)})});
async function uploadPickup(id,files){const status=$('#up-'+CSS.escape(id))||$('#message');uploading=true;let ok=0;try{for(const [i,original] of [...files].entries()){const file=await PointForm.prepareMedia(original);const label=`Subiendo foto de partida ${i+1} de ${files.length}`;status.textContent=label+'…';try{await PointForm.uploadMedia('/api/supplier/needs/'+encodeURIComponent(id)+'/media?stage=pickup',file,{csrf,onProgress:p=>status.textContent=`${label}… ${Math.round(p*100)}%`});ok++}catch(err){status.textContent=`No se pudo subir «${original.name}»: ${err.message}`;return}}}finally{uploading=false;if(ok){await refresh();flash(`${ok} ${ok===1?'foto guardada':'fotos guardadas'} (partida).`);render()}}}
// Asignar en persona: elegir al corredor que está en el acopio; la carrera pasa a su «Yo» y a «Por despachar».
let assignNeed=null;
function drawAssign(){const q=foldNeed($('#assignFind').value),dq=q.replace(/\D/g,''),list=runners.filter(r=>!q||foldNeed(r.name).includes(q)||dq.length>=3&&String(r.telephone||'').replace(/\D/g,'').includes(dq));$('#assignList').innerHTML=list.length?list.map(r=>`<button type="button" data-runner="${clean(r.id)}"><span aria-hidden="true">🏃</span><b>${clean(r.name)}</b><small>${clean(r.telephone||'')}${r.active?` · ${r.active} en camino`:''}</small></button>`).join(''):'<p class="empty">Ningún corredor coincide.</p>'}
function openAssign(id){assignNeed=findNeed(id);if(!assignNeed)return;$('#assignWhat').textContent=`${[assignNeed.camp.area||assignNeed.camp.place,assignNeed.camp.code].filter(Boolean).join(' · ')} — ${String(assignNeed.need||'').slice(0,120)}`;$('#assignFind').value='';drawAssign();$('#assignDlg').showModal();$('#assignFind').focus()}
$('#assignFind').oninput=drawAssign;
$('#assignList').onclick=async e=>{const b=e.target.closest('[data-runner]');if(!b||!assignNeed)return;const r=runners.find(x=>x.id===b.dataset.runner),n=assignNeed;$('#assignDlg').close();if(await AppNav.choose(`¿Asignar a ${r.name}?`,{detail:`${[n.camp.area||n.camp.place,n.camp.code].filter(Boolean).join(' · ')}. Le aparece en su «Yo» y aquí en «Por despachar».`,options:[['go','🏃 Sí, asignar','go'],['no','Cancelar','']]})!=='go')return;try{await api('/api/supplier/needs/'+encodeURIComponent(n.id)+'/assign','POST',{runnerId:r.id});mainTab='todo';highlightNeed=n.id;await refresh();flash(`Asignada a ${r.name}. Arma la lista de empaque y márcala «Despachada».`);render();requestAnimationFrame(()=>document.querySelector(`#feed [data-need="${CSS.escape(n.id)}"]`)?.scrollIntoView({behavior:'smooth',block:'center'}))}catch(err){flash(err.message);await refresh()}};
async function refresh(){try{const data=await api('/api/supplier/runs');runs=data.runs||[];open=data.open||[];runners=data.runners||[];centers=data.centers||[];drawCenters();if(document.activeElement!==$('#centerInput')){center=data.center||'';$('#centerInput').value=center}render()}catch(err){$('#message').textContent=err.message}}
let popupOpen=false;if(map)map.on('popupopen',()=>popupOpen=true).on('popupclose',()=>popupOpen=false);
// Se actualiza cada 20 s (llegan corredores nuevos), salvo con una ventana abierta o subiendo fotos.
setInterval(()=>{if(csrf&&!popupOpen&&!uploading&&!document.querySelector('dialog[open]'))refresh()},20000);
(async()=>{const r=await fetch('/api/supplier/session',{credentials:'same-origin',cache:'no-store'}).catch(()=>null);if(r&&r.ok){signedIn(await r.json());return refresh()}if(await relogin())return refresh();render();showGate()})();
</script></body></html>
