async function saveProject(id,data,note){const el=note&&$('#'+note+'-'+CSS.escape(id));try{const out=await api('/api/builder/needs/'+encodeURIComponent(id)+'/project','POST',data);const n=projectOf(id);if(n)Object.assign(n,{scope:out.scope,materials:out.materials,progress:out.progress});if(el){el.textContent='✓ Guardado';setTimeout(()=>{if(el.textContent==='✓ Guardado')el.textContent=''},2500)}return true}catch(err){if(el)el.textContent='No se pudo guardar: '+err.message;else flash(err.message);return false}}
// Avance: se ve al mover y se guarda al soltar. Qué falta: se guarda al salir del cuadro.
$('#feed').addEventListener('input',e=>{const r=e.target.closest('[data-progress]');if(r)$('#pct-'+CSS.escape(r.dataset.progress)).textContent=r.value+'%'});
$('#feed').addEventListener('change',e=>{const r=e.target.closest('[data-progress]');if(r){saveProject(r.dataset.progress,{progress:Number(r.value)},'ps');return}const t=e.target.closest('[data-scope]');if(t)saveProject(t.dataset.scope,{scope:t.value},'ss')});
// Materiales: el mismo selector de la lista de empaque, con el catálogo de obra; las cantidades del mismo material se suman.
async function addMaterials(id){const n=projectOf(id);if(!n)return;let items;try{items=await api('/api/builder/materials')}catch(err){flash(err.message);render();return}PointForm.openPacking({subtitle:'Materiales',items,save:async lines=>{const list=(n.materials||[]).map(m=>({item:m.item,quantity:m.quantity}));for(const l of lines){const same=list.find(m=>foldNeed(m.item)===foldNeed(l.item));if(same)same.quantity+=l.quantity;else list.push({item:l.item,quantity:l.quantity})}if(!await saveProject(id,{materials:list}))throw Error('No se pudo guardar.');render();flash('Materiales guardados.')}})}
// Fotos de la obra: el teléfono ofrece cámara o galería; se suben a la etapa elegida.
function pickFiles(id){return new Promise(resolve=>{const input=document.getElementById(id);input.value='';input.onchange=()=>resolve([...input.files]);input.click()})}
async function uploadProject(id,stage,files){const status=$('#up-'+CSS.escape(id))||$('#message'),label={before:'antes',progress:'avance',after:'final'}[stage];let ok=0;for(const [i,original] of files.entries()){const file=await PointForm.prepareMedia(original);const txt=`Subiendo foto (${label}) ${i+1} de ${files.length}`;status.textContent=txt+'…';try{await PointForm.uploadMedia('/api/builder/needs/'+encodeURIComponent(id)+'/media?stage='+stage,file,{csrf,onProgress:p=>status.textContent=`${txt}… ${Math.round(p*100)}%`});ok++}catch(err){status.textContent=`No se pudo subir «${original.name}»: ${err.message}`;return false}}status.textContent='';if(ok){await refresh();flash(`${ok} ${ok===1?'foto guardada':'fotos guardadas'} (${label}).`);render()}return true}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const target=photoFor;$('#pickDialog').close();pickFiles(b.dataset.pick).then(async f=>{if(!target||!f.length)return;if(target.assess){assessFiles.push(...f);drawAssessThumbs();return}const ok=await uploadProject(target.id,target.stage,f);if(ok&&finishAfter===target.id){finishAfter=null;finishProject(target.id,true)}})});
// Terminar: con fotos disponibles, primero una foto final; luego se confirma y queda al 100 %.
async function finishProject(id,skipPhoto=false){const n=projectOf(id);if(!n)return;if(mediaOn&&!skipPhoto&&!(n.media||[]).some(m=>m.stage==='after')){finishAfter=id;photoFor={id,stage:'after'};$('#pickTitle').textContent='Foto final de la obra';$('#pickDialog').showModal();flash('Para terminar la obra, agrega una foto final.');render();return}if(!await AppNav.confirm('¿Marcar la obra como terminada?',{yes:'Sí, terminada',detail:'Queda al 100 % y sale de «Mis obras».'}))return;try{await api('/api/builder/needs/'+encodeURIComponent(id)+'/complete','POST');await refresh();flash('Obra terminada. ¡Gracias!');render()}catch(err){await refresh();flash(err.message);render()}}
$('#feed').addEventListener('click',e=>{const ph=e.target.closest('[data-photo]');if(ph){photoFor={id:ph.dataset.photo,stage:ph.dataset.stage};finishAfter=null;$('#pickTitle').textContent='Foto: '+({before:'antes',progress:'avance',after:'final'}[ph.dataset.stage]);$('#pickDialog').showModal();return}
const am=e.target.closest('[data-materials]');if(am){addMaterials(am.dataset.materials);return}
const md=e.target.closest('[data-matdel]');if(md){const n=projectOf(md.dataset.matdel);if(!n)return;const list=(n.materials||[]).filter((_,i)=>i!==Number(md.dataset.i)).map(m=>({item:m.item,quantity:m.quantity}));saveProject(n.id,{materials:list}).then(ok=>{if(ok)render()});return}},true);
// --- Evaluar una obra ---
let assessFor=null,assessMine=null,assessMats=[],assessFiles=[];
function drawAssessMats(){$('#assessMats').innerHTML=assessMats.length?assessMats.map((m,i)=>`<li><b>${clean(m.quantity)}</b> × ${clean(m.item)}<button type="button" class="matdel" data-amdel="${i}" aria-label="Quitar">✕</button></li>`).join(''):'<li class="muted">Sin materiales todavía.</li>'}
function drawAssessThumbs(){$('#assessThumbs').innerHTML=assessFiles.map((f,i)=>`<figure class="pf-thumb"><span class="pickthumb">${f.type.startsWith('image/')?`<img src="${URL.createObjectURL(f)}" alt="">`:'🎥'}</span><button type="button" data-afdel="${i}" aria-label="Quitar">✕</button></figure>`).join('')}
function openAssess(id){const n=findNeed(id);if(!n)return;assessFor=n;assessMine=(n.assessments||[]).find(x=>x.by===myId)||null;const f=$('#assessForm'),x=assessMine||{work:[],materials:[],days:0,workers:0,notes:''};$('#assessTitle').textContent=assessMine?'Mi evaluación':'Evaluar obra';$('#assessFor').textContent=`${n.camp.area||n.camp.code}${n.camp.place?' · '+n.camp.place:''}. Cualquiera puede evaluar; tomar la obra es aparte.`;const others=x.work.filter(w=>!WORK.includes(w));$('#workGrid').innerHTML=WORK.map(w=>`<label class="wk"><input type="checkbox" value="${clean(w)}"${x.work.includes(w)?' checked':''}><span>${clean(w)}</span></label>`).join('');f.elements.other.value=others.join(', ');assessMats=x.materials.map(m=>({item:m.item,quantity:m.quantity}));drawAssessMats();f.elements.days.value=x.days||'';f.elements.workers.value=x.workers||'';f.elements.notes.value=x.notes||'';assessFiles=[];drawAssessThumbs();$('#assessMsg').textContent='';$('#assessDialog').showModal();$('#assessDialog .abody').scrollTop=0}
$('#assessDialog').addEventListener('cancel',e=>e.preventDefault());$('#assessCancel').onclick=()=>$('#assessDialog').close();
$('#assessAddMat').onclick=async()=>{let items;try{items=await api('/api/builder/materials')}catch(err){$('#assessMsg').textContent=err.message;return}PointForm.openPacking({subtitle:'Materiales',items,save:async lines=>{for(const l of lines){const same=assessMats.find(m=>foldNeed(m.item)===foldNeed(l.item));if(same)same.quantity+=l.quantity;else assessMats.push({item:l.item,quantity:l.quantity})}drawAssessMats()}})};
$('#assessMats').onclick=e=>{const b=e.target.closest('[data-amdel]');if(b){assessMats.splice(Number(b.dataset.amdel),1);drawAssessMats()}};
$('#assessThumbs').onclick=e=>{const b=e.target.closest('[data-afdel]');if(b){assessFiles.splice(Number(b.dataset.afdel),1);drawAssessThumbs()}};
$('#assessPhoto').onclick=()=>{photoFor={assess:true};finishAfter=null;$('#pickTitle').textContent='Fotos de la evaluación';$('#pickDialog').showModal()};
$('#assessForm').onsubmit=async e=>{e.preventDefault();const f=e.target,n=assessFor;if(!n)return;const work=[...$('#workGrid').querySelectorAll('input:checked')].map(i=>i.value).concat(f.elements.other.value.split(',').map(x=>x.trim()).filter(Boolean));const body={work,materials:assessMats,days:Number(f.elements.days.value)||0,workers:Number(f.elements.workers.value)||0,notes:f.elements.notes.value};const bs=[...document.querySelectorAll('#assessForm [type=submit]')];bs.forEach(b=>b.disabled=true);$('#assessMsg').textContent='Guardando…';try{const x=await api('/api/builder/needs/'+encodeURIComponent(n.id)+'/assessments'+(assessMine?'/'+encodeURIComponent(assessMine.id):''),'POST',body);for(const [i,orig] of assessFiles.entries()){$('#assessMsg').textContent=`Subiendo foto ${i+1} de ${assessFiles.length}…`;const file=await PointForm.prepareMedia(orig);await PointForm.uploadMedia('/api/builder/needs/'+encodeURIComponent(n.id)+'/media?stage=inspect&ref='+encodeURIComponent(x.id),file,{csrf})}$('#assessDialog').close();await refresh();flash('Evaluación guardada. Todos los constructores la ven.');render()}catch(err){$('#assessMsg').textContent='No se pudo guardar: '+err.message}finally{bs.forEach(b=>b.disabled=false)}};
$('#feed').addEventListener('click',e=>{const a=e.target.closest('[data-assess]');if(a){openAssess(a.dataset.assess);return}const u=e.target.closest('[data-usemats]');if(u){const n=projectOf(u.dataset.usemats);const src=(n?.assessments||[]).slice().reverse().find(x=>x.materials.length);if(n&&src)saveProject(n.id,{materials:src.materials.map(m=>({item:m.item,quantity:m.quantity}))}).then(ok=>{if(ok){render();flash(`Materiales copiados de la evaluación de ${AppNav.shortName(src.byName)}.`)}})}},true);
function mobileView(view){document.body.classList.toggle('mobile-list',view==='list');document.body.classList.toggle('mobile-map',view==='map');document.querySelectorAll('.mobile-nav button').forEach(b=>b.classList.toggle('active',b.dataset.view===view));if(view==='map'&&map)setTimeout(()=>{map.invalidateSize();if(focusCamp)applyFocus()},60)}
document.querySelector('.mobile-nav').addEventListener('click',e=>{const b=e.target.closest('button[data-view]');if(b)mobileView(b.dataset.view)});
let popupOpen=false;if(map)map.on('popupopen',()=>popupOpen=true).on('popupclose',()=>popupOpen=false);
setInterval(()=>{if(csrf&&!popupOpen)refresh()},30000);
(async()=>{const r=await fetch('/api/builder/session',{credentials:'same-origin',cache:'no-store'}).catch(()=>null);if(r&&r.ok){const s=await r.json();csrf=s.csrf;builderName=s.name;myId=s.id||'';$('#who').hidden=false;$('#whoName').textContent=(window.AppNav?AppNav.shortName(builderName):builderName);$('#whoName').title=builderName;return refresh()}if(await relogin())return refresh();showGate()})();

// Acceso al día (nav.js): roles nuevos al menú; sin acceso a esta página, al inicio.
window.AppNav?.watchAccess('/api/builder/session','/builder.html');
</script></body></html>
