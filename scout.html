const $=s=>document.querySelector(s),clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fold=v=>String(v??'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
const ago=v=>{const ms=Date.now()-Date.parse(v);if(!v||isNaN(ms))return '';const m=Math.round(ms/6e4);return m<60?`hace ${Math.max(1,m)} min`:m<1440?`hace ${Math.round(m/60)} h`:`hace ${Math.round(m/1440)} d`};
const noGpsIco='<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 22s7-6.1 7-12a7 7 0 0 0-12.3-4.6"/><path d="M5.2 7.6A7 7 0 0 0 5 10c0 5.9 7 12 7 12"/><circle cx="12" cy="10" r="2.5"/><path d="M3 3l18 18"/></svg>';
const svgI=p=>`<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${p}</svg>`,ico=k=>typeof PointForm!=='undefined'&&PointForm.icons[k]||'',navIco=svgI('<path d="M3 11l18-8-8 18-2-8z"/>');
const apple=/iPhone|iPad|iPod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const autoCode=c=>/^P-[0-9a-f]{12}$/i.test(String(c||''));
const STATUS={pending:['pending','Por revisar'],held:['held','🔒 Solo tu equipo']};
const PPL=[['adults','adultos','adult'],['children','niños','child'],['babies','bebés','baby'],['olderAdults','mayores','elder'],['disabled','discapacidad','disabled'],['families','familias','family']];
let points=[],who='all',view='list',map=null,layer=null,editing=null,myTeam='',canEdit=false;const phoneQ=matchMedia('(max-width:760px)');
try{who=localStorage.getItem('scoutWho')||'all'}catch{}
const hasCoords=p=>Array.isArray(p.coords)&&p.coords.length===2;
const ofWho=p=>who==='all'||(who==='mine'?p.addedByMe:p.addedByTeam);
function shown(){const q=fold($('#find').value.trim());return points.filter(p=>ofWho(p)&&(!q||fold([p.code,p.area,p.place,p.directions,p.needs,p.coordinator,p.addedByMate,...(p.activeNeeds||[]).map(n=>n.need)].join(' ')).includes(q)))}
function title(p){return clean(autoCode(p.code)?[p.area,p.place].filter(Boolean).join(' · ')||'Punto':`${p.code} · ${p.area||''}`)}
// Abrir en Maps como Runners: con GPS el punto exacto; sin GPS, una búsqueda aproximada por lugar y zona.
function locationLink(c){if(hasCoords(c)){const q=encodeURIComponent(c.coords.join(','));return {url:apple?`https://maps.apple.com/?q=${q}`:`https://www.google.com/maps/search/?api=1&query=${q}`,label:apple?'Abrir en Apple Maps':'Abrir en Google Maps'}}if(c.gps)try{const u=new URL(c.gps);if(u.protocol==='https:'&&['maps.google.com','www.google.com','google.com','maps.app.goo.gl'].includes(u.hostname))return {url:u.href,label:'Abrir en Google Maps'}}catch{}return null}
function needChips(text){const pf=typeof PointForm!=='undefined'?PointForm:{},types=pf.NEEDS||[],icons=pf.icons||{};return `<div class="chips">${String(text||'').split(/[,\n]+/).map(x=>x.trim()).filter(Boolean).map(part=>{const dc=pf.needChip?pf.needChip(part):'';if(dc)return dc;const hit=types.find(([l])=>fold(l)===fold(part));return hit?`<span class="chip">${icons[hit[1]]||''}${clean(hit[0])}</span>`:`<span class="chip text">${clean(part)}</span>`}).join('')}</div>`}
function peopleLine(p){const num=v=>String(v||'').trim(),parts=PPL.filter(([k])=>num(p[k])&&num(p[k])!=='0').map(([k,l,i])=>`<span class="pc">${ico(i)}<b>${clean(num(p[k]))}</b> ${l}</span>`);if(!num(p.people)&&!parts.length)return '';return `<div class="grp g-ppl">${num(p.people)?`<span class="pc">${ico('people')}<b>${clean(num(p.people))}</b> ${num(p.people)==='1'?'persona':'personas'}</span>`:''}${parts.join('')}</div>`}
function needRow(n){const route=n.status==='IN_PROGRESS';return `<li>${needChips(n.need)}<div class="nmeta">${route?`<span class="st route">🏃 En camino${n.runnerName?' · '+clean(n.runnerName):''}</span>`:'<span class="st">Necesita</span>'}${n.urgency==='urgente'?'<span class="st urg">Urgente</span>':''}<span>${clean(ago(n.revisedAt||n.createdAt))}</span></div></li>`}
// Contactos (nombres y teléfonos): el servidor solo los manda a quien es de un equipo. Tocar el número abre «📞 Llamar /
// 💬 WhatsApp», como el «Reportado por» en Runners. En la tarjeta se ven tres; los demás bajo «y N más».
function contactRow(c){const role=c.reporter?'Reportado por':'Contacto';return `<li><span>${c.reporter?'📣 ':'👤 '}${clean(c.name||'Sin nombre')}${c.reporter?' <small>reporta</small>':''}</span>${c.phone?`<button type="button" class="telbtn" data-tel="${clean(c.phone)}" data-tname="${clean(c.name||'Sin nombre')}" data-trole="${role}">${clean(c.phone)}</button>`:'<small>sin teléfono</small>'}</li>`}
function contactsHtml(p,all){const list=p.contacts||[];if(!list.length)return '';const head=all?list:list.slice(0,3),rest=all?[]:list.slice(3);return `<div class="grp"><span class="needlbl">Contactos</span><ul class="cl">${head.map(contactRow).join('')}${rest.length?`<li><details><summary>y ${rest.length} ${rest.length===1?'contacto más':'contactos más'}</summary><ul class="cl">${rest.map(contactRow).join('')}</ul></details></li>`:''}</ul></div>`}
function telPop(b){closeTelPop();const ph=b.dataset.tel,d=ph.replace(/\D/g,''),wa=(d.length===7||d.length===8?'507':'')+d,pop=document.createElement('div');pop.className='reppop';pop.setAttribute('role','dialog');pop.innerHTML=`<div class="rp-h">${clean(b.dataset.tname)} <small>${clean(b.dataset.trole)}</small></div><div class="rp-num">${clean(ph)}</div><div class="rp-acts"><a class="btn small" href="tel:${clean(d)}">📞 Llamar</a><a class="btn small wa" target="_blank" rel="noopener noreferrer" href="https://wa.me/${clean(wa)}">💬 WhatsApp</a></div>`;document.body.appendChild(pop);const r=b.getBoundingClientRect();pop.style.top=(r.bottom+scrollY+6)+'px';pop.style.left=Math.max(8,Math.min(r.left+scrollX,document.documentElement.clientWidth-pop.offsetWidth-8))+'px'}
function closeTelPop(){document.querySelectorAll('.reppop').forEach(x=>x.remove())}
document.addEventListener('click',e=>{const b=e.target.closest('[data-tel]');if(b){e.preventDefault();e.stopPropagation();telPop(b);return}if(!e.target.closest('.reppop'))closeTelPop()},true);
document.addEventListener('scroll',closeTelPop,true);
function card(p){const [cls,label]=STATUS[p.pointStatus]||['',''],link=locationLink(p),needs=p.activeNeeds||[],place=[p.place&&`<b>${clean(p.place)}</b>`,p.directions&&clean(p.directions)].filter(Boolean).join(' · ');const held=p.pointStatus==='held'&&p.heldUntil?` hasta ${new Date(p.heldUntil).toLocaleTimeString('es-PA',{hour:'numeric',minute:'2-digit'})}`:'';
return `<article class="card" data-id="${clean(p.id)}"><div class="cardtop"><span class="ntitle"><b>${clean(p.area||p.code)}</b>${p.code&&!autoCode(p.code)&&p.area?` <span class="ncode">${clean(p.code)}</span>`:''}</span>${label?`<span class="badge ${cls}">${clean(label+held)}</span>`:''}${p.highestUrgency==='urgente'?'<span class="badge urgente">Urgente</span>':''}<span class="cardloc">${hasCoords(p)?`<button type="button" class="iconbtn gps" data-onmap="${clean(p.id)}" title="Ver en el mapa" aria-label="Ver en el mapa">${ico('pin')}</button>`:`<span class="iconbtn gps off" title="Sin GPS: no aparece en el mapa" role="img" aria-label="Sin GPS">${noGpsIco}</span>`}${link?`<a class="iconbtn" target="_blank" rel="noopener noreferrer" href="${clean(link.url)}" title="${link.label}" aria-label="${link.label}">${navIco}</a>`:`<span class="iconbtn off" title="Sin ubicación para Maps" role="img" aria-label="Sin ubicación para Maps">${navIco}</span>`}</span></div>
<div class="grp"><div class="grow">${ico('pin')}<span class="gtext">${place||'<span class="muted">Sin indicaciones escritas</span>'}${p.coordinator?` · 📣 ${clean(p.coordinator)}`:''}</span></div></div>${peopleLine(p)}${contactsHtml(p)}
<div class="grp"><span class="needlbl">Necesita</span>${needs.length?`<ul class="nl">${needs.map(needRow).join('')}</ul>`:p.pointStatus==='pending'&&p.needs?needChips(p.needs):'<span class="muted">Sin necesidades abiertas</span>'}</div>
<div class="foot"><span class="by">${p.addedByMe?'<span class="mine">Lo agregaste tú</span> · ':p.addedByTeam?`Agregado por <b>${clean(p.addedByMate||'tu equipo')}</b> (tu equipo) · `:''}Reportado ${clean(ago(p.created))}${p.lastCheckup?` · Última revisión ${clean(ago(p.lastCheckup))}`:''}</span>${p.pointStatus==='pending'?`<button type="button" class="btn small" data-check="${clean(p.id)}">🔍 Corroborar</button><span class="muted">Por revisar: las necesidades se actualizan cuando se publique.</span>`:`${myTeam?`<button type="button" class="btn small" data-update="${clean(p.id)}">📝 Actualizar necesidades</button>`:''}<button type="button" class="btn small ghost" data-check="${clean(p.id)}">Ver más</button><a class="btn small ghost" href="/camp.html?id=${encodeURIComponent(p.id)}">Ver ficha y actividad</a>`}</div></article>`}
function draw(){$('#who').value=who;const list=shown();syncWho();$('#count').textContent=`${list.length} ${list.length===1?'punto':'puntos'}`;
$('#list').innerHTML=list.length?list.map(card).join(''):`<p class="empty">${points.some(ofWho)?'Ningún punto con esa búsqueda.':who==='mine'?'Todavía no agregaste puntos. Toca «+ Agregar punto» para reportar uno.':who==='team'?'Tu equipo todavía no agregó puntos.':'No hay puntos todavía.'}</p>`;if(!phoneQ.matches||view==='map')drawMap(list)}
function drawMap(list){if($('#app').hidden)return;if(typeof L==='undefined'){$('#mapHint').textContent='Mapa no disponible sin conexión. La lista sigue accesible.';return}const first=!map;if(!map){map=L.map('map').setView([7.46,-80.33],10);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap contributors'}).addTo(map);layer=L.layerGroup().addTo(map)}setTimeout(()=>map.invalidateSize(),30);layer.clearLayers();const withGps=list.filter(hasCoords);
withGps.forEach(p=>{const urgent=p.highestUrgency==='urgente',m=L.circleMarker(p.coords,{radius:9,weight:2,color:'#fff',fillColor:urgent?'#c62828':(p.activeNeeds||[]).length?'#ed7654':'#19745f',fillOpacity:1});m._pid=p.id;m.bindPopup(`<b>${title(p)}</b><br>${(p.activeNeeds||[]).length} ${(p.activeNeeds||[]).length===1?'necesidad':'necesidades'}<br><a href="#" data-tolist="${clean(p.id)}">Ver en la lista</a>`).addTo(layer)});
if(withGps.length&&(first||who!==drawMap.who))map.fitBounds(L.latLngBounds(withGps.map(p=>p.coords)).pad(.2),{maxZoom:14});drawMap.who=who;const missing=list.length-withGps.length;$('#mapHint').textContent=`🔴 Urgente · 🟠 Con necesidades · 🟢 Sin necesidades${missing?` · ${missing} sin GPS: solo en la lista`:''}`}
// Ficha en modo vista, como al abrir un punto en Command: «🔍 Corroborar» en los por revisar (datos del reporte y las
// necesidades reportadas; lo publica quien aprueba en Command o administración) y «Ver más» en los publicados (sus
// necesidades activas). Aquí no se edita: «✏️ Editar» (solo agentes) abre el punto en modo edición en Command.
const FIELDS={code:'Código',area:'Área',place:'Ubicación',directions:'Dirección',coordinator:'Reportado por',people:'Personas',adults:'Adultos',children:'Niños',babies:'Bebés',olderAdults:'Adultos mayores',disabled:'Con discapacidad',families:'Familias',campStatus:'Servicio',notes:'Notas del grupo'};
// La ficha es una pantalla de Scout con su dirección (/scout.html?punto=<id>), no una ventana: «‹ Volver», el botón Atrás
// del teléfono y recargar funcionan; al volver, la lista sigue donde estaba. Ir a Command («Editar») o a la ficha
// pública y regresar vuelve aquí.
let listScroll=0,mapAfter=null;
const viewId=()=>new URLSearchParams(location.search).get('punto');
function openView(id){listScroll=$('#list').scrollTop;history.pushState({pv:1},'','?punto='+encodeURIComponent(id));route();$('#pview').scrollTop=0;scrollTo(0,0)}
function leaveView(){if(history.state?.pv)history.back();else{history.replaceState(null,'',location.pathname);route()}}
function route(){const id=viewId(),inView=!!id&&$('#gateWrap').hidden;$('#pview').hidden=!inView;$('#app').hidden=inView;$('#mnav').hidden=inView;if(inView){renderView(id);return}draw();map?.invalidateSize();$('#list').scrollTop=listScroll;if(mapAfter){const id2=mapAfter;mapAfter=null;focusMap(id2)}}
function renderView(id){const p=points.find(x=>x.id===id),v=$('#pview');let notice='';try{notice=sessionStorage.getItem('scoutNotice')||'';sessionStorage.removeItem('scoutNotice')}catch{}
if(!p){v.innerHTML=`<div class="pvbar"><button type="button" class="pvback" data-pvback>‹ Volver</button><div class="pvtitle"><b>Punto no disponible</b></div></div><p class="empty">Este punto ya no está en Scout (fue archivado, unido a otro o no es de tu equipo).</p>`;return}
const pending=p.pointStatus==='pending',needs=p.activeNeeds||[],link=locationLink(p),approx=!hasCoords(p)&&!link&&(p.place||p.area),search=approx?`https://www.google.com/maps/search/?api=1&query=${encodeURIComponent([p.place,p.area,'Panamá'].filter(Boolean).join(', '))}`:'';
v.innerHTML=`<div class="pvbar"><button type="button" class="pvback" data-pvback>‹ Volver</button><div class="pvtitle"><b>${pending?'🔍 Corroborar punto':'📋 Ver punto'}</b><small>${title(p)}</small></div></div>${notice?`<p class="notice" role="status">${clean(notice)}</p>`:''}<article class="card">${pending?'<p class="checknote"><b>Por revisar:</b> todavía no es público. Confirma en el lugar que los datos coinciden; se publica cuando lo aprueban en Checkup o administración.</p>':''}<div class="fields">${Object.entries(FIELDS).map(([k,l])=>p[k]&&!(k==='code'&&autoCode(p[k]))?`<div><b>${l}</b>${clean(p[k])}</div>`:'').join('')}${hasCoords(p)?`<div><b>GPS</b>${clean(p.coords.join(', '))}</div>`:''}<div><b>Reportado</b>${clean(ago(p.created))}${p.addedByMe?' · por ti':p.addedByTeam?` · por ${clean(p.addedByMate||'tu equipo')}`:''}</div>${p.lastCheckup?`<div><b>Última revisión</b>${clean(ago(p.lastCheckup))}</div>`:''}</div>${contactsHtml(p,true)}${pending?`<span class="needlbl">Necesidades reportadas</span>${p.needs?needChips(p.needs):'<span class="muted">Sin necesidades en el reporte.</span>'}`:`<span class="needlbl">Necesita</span>${needs.length?`<ul class="nl">${needs.map(needRow).join('')}</ul>`:'<span class="muted">Sin necesidades abiertas</span>'}`}<div class="foot">${canEdit?`<a class="btn small" href="/command.html?punto=${encodeURIComponent(p.id)}&editar=1">✏️ Editar</a>`:''}${link?`<a class="btn small ghost" target="_blank" rel="noopener noreferrer" href="${clean(link.url)}">${clean(link.label)}</a>`:search?`<a class="btn small ghost" target="_blank" rel="noopener noreferrer" href="${clean(search)}">Buscar en Google Maps</a>`:''}${hasCoords(p)?`<button type="button" class="btn small ghost" data-pvmap="${clean(p.id)}">📍 Ver en el mapa</button>`:''}${pending?'':`${myTeam?`<button type="button" class="btn small" data-update="${clean(p.id)}">📝 Actualizar necesidades</button>`:''}<a class="btn small ghost" href="/camp.html?id=${encodeURIComponent(p.id)}">Ver ficha y actividad</a>`}</div>${search?'<p class="approx">Búsqueda aproximada: no hay GPS registrado.</p>':link?'':'<p class="approx">Sin ubicación registrada.</p>'}</article>`}
// «📝 Actualizar necesidades»: las necesidades activas del punto; las abiertas se cambian o se quitan, y se agrega una nueva.
function openUpdate(id){editing=id;drawUpdate();const d=$('#updDialog');if(!d.open)d.showModal()}
function drawUpdate(msg,ok){const p=points.find(x=>x.id===editing),d=$('#updDialog');if(!p){d.close();return}const needs=p.activeNeeds||[];
d.innerHTML=`<div class="dh"><div><b>📝 Actualizar necesidades</b><small>${title(p)}</small></div><button type="button" class="x" data-close aria-label="Cerrar">✕</button></div><div class="db">${needs.map(n=>`<div class="card" data-nid="${clean(n.id)}">${needChips(n.need)}<div class="nmeta" style="margin-top:6px">${n.status==='IN_PROGRESS'?`<span class="st route">🏃 En camino${n.runnerName?' · '+clean(n.runnerName):''}</span>`:'<span class="st">Necesita</span>'}${n.urgency==='urgente'?'<span class="st urg">Urgente</span>':''}<span>${clean(ago(n.revisedAt||n.createdAt))}</span></div>${n.kind?'':`<div class="foot"><button type="button" class="btn small ghost" data-edit="${clean(n.id)}">Cambiar</button>${n.status==='OPEN'?`<button type="button" class="btn small quiet" data-remove="${clean(n.id)}">Ya no lo necesitan</button>`:'<span class="muted">Va en camino: se puede cambiar, no quitar.</span>'}</div>`}</div>`).join('')||'<p class="muted">Este punto no tiene necesidades abiertas.</p>'}<h3>Nueva necesidad</h3><button type="button" class="btn" data-edit="new">＋ Reportar otra necesidad</button><p class="dmsg${ok?' ok':''}" role="status">${clean(msg||'')}</p></div>`}
// Una carrera de otro equipo llega sin el detalle (solo estado y urgencia): ahí solo se cambia la urgencia.
function editForm(n){const hidden=n&&!n.need;return `<form class="nf" data-form="${n?clean(n.id):'new'}"${hidden?' data-urgonly="1"':''}>${hidden?'<p class="muted">La lleva un runner de otro equipo: solo puedes cambiar la urgencia.</p>':'<div class="pf"></div>'}<label class="needlbl">Urgencia<select name="urgency"><option value="normal">Normal</option><option value="urgente">Urgente</option></select></label><div class="row"><button class="btn" type="submit">${n?'Guardar cambios':'Reportar necesidad'}</button><button class="btn ghost" type="button" data-cancel>Cancelar</button></div><p class="dmsg" role="status"></p></form>`}
function showForm(id){const p=points.find(x=>x.id===editing),n=(p?.activeNeeds||[]).find(x=>x.id===id),host=id==='new'?$('#updDialog [data-edit="new"]'):$(`#updDialog [data-nid="${CSS.escape(id)}"] .foot`);if(!host||typeof PointForm==='undefined')return;host.outerHTML=editForm(n);const f=$(`#updDialog [data-form="${CSS.escape(n?n.id:'new')}"]`),pick=f.querySelector('.pf');if(pick){pick.innerHTML=PointForm.needsHtml();PointForm.fillNeeds(pick,n?n.need:'')}f.urgency.value=n?.urgency==='urgente'?'urgente':'normal';f.scrollIntoView({block:'nearest'})}
async function send(url,method,body){const r=await fetch(url,{method,credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});const d=await r.json().catch(()=>({}));if(!r.ok)throw new Error(d.error||'No se pudo guardar. Vuelve a intentarlo.');return {status:r.status,data:d}}
$('#updDialog').addEventListener('click',async e=>{const d=$('#updDialog');if(e.target===d||e.target.closest('[data-close]'))return d.close();if(e.target.closest('[data-cancel]'))return drawUpdate();const ed=e.target.closest('[data-edit]');if(ed)return showForm(ed.dataset.edit);const rm=e.target.closest('[data-remove]');if(rm){if(window.AppNav&&!await AppNav.confirm('¿Quitar esta necesidad?',{yes:'Sí, ya no lo necesitan',detail:'Deja de aparecer para runners y en el mapa. Queda en el historial del punto.'}))return;rm.disabled=true;try{await send('/api/full/scout/needs/'+encodeURIComponent(rm.dataset.remove),'PATCH',{status:'DELETED'});await load();drawUpdate('Necesidad quitada.',true)}catch(err){rm.disabled=false;drawUpdate(err.message)}}});
$('#updDialog').addEventListener('submit',async e=>{e.preventDefault();const f=e.target.closest('[data-form]');if(!f)return;const urgOnly=!!f.dataset.urgonly,need=urgOnly?'':PointForm.readNeeds(f.querySelector('.pf')),urgency=f.urgency.value,msg=f.querySelector('.dmsg'),b=f.querySelector('[type=submit]');if(!need&&!urgOnly){msg.textContent='Marca qué necesita.';return}b.disabled=true;try{const id=f.dataset.form;id==='new'?await send('/api/full/scout/camps/'+encodeURIComponent(editing)+'/needs','POST',{need,urgency}):await send('/api/full/scout/needs/'+encodeURIComponent(id),'PATCH',urgOnly?{urgency}:{need,urgency});await load();drawUpdate(id==='new'?'Necesidad reportada: ya la ven los runners.':'Cambios guardados.',true)}catch(err){msg.textContent=err.message;b.disabled=false}});
// Como Supply: en la computadora el mapa a la izquierda y la lista a la derecha; en el teléfono «Lista / Mapa».
function setView(v){view=v;document.body.classList.toggle('mobile-list',v!=='map');document.body.classList.toggle('mobile-map',v==='map');const b=$('#mview'),m=v==='map';b.setAttribute('aria-pressed',String(m));b.title=m?'Ver la lista':'Ver el mapa';b.setAttribute('aria-label',b.title);draw()}
// Teléfono: pestañas con ícono (🌐 todos · 🙋 míos · 👥 mi equipo, con cuántos según la búsqueda) en lugar del selector;
// deslizar a los lados cambia de pestaña (nav.js) y la búsqueda sigue igual en todas. Un solo botón alterna lista y mapa.
// 🙋 / 👥 es un solo botón (como el de lista/mapa): tócalo para ver los tuyos; tócalo otra vez y cambia a los de tu
// equipo (y de vuelta). Recuerda cuál usaste por última vez.
let lastMine=(()=>{try{return localStorage.getItem('scoutLastMine')||'mine'}catch{return 'mine'}})();
function syncWho(){const q=fold($('#find').value.trim()),hit=p=>!q||fold([p.code,p.area,p.place,p.directions,p.needs,p.coordinator,p.addedByMate,...(p.activeNeeds||[]).map(n=>n.need)].join(' ')).includes(q),cnt=w=>points.filter(p=>hit(p)&&(w==='all'||(w==='mine'?p.addedByMe:p.addedByTeam))).length;const all=$('#mainTabs [data-who="all"]');all.setAttribute('aria-selected',String(who==='all'));all.querySelector('.wcount').textContent=cnt('all')||'';const t=$('#mainTabs [data-whotoggle]'),w=who==='all'?lastMine:who,mine=w==='mine';t.dataset.who=w;t.setAttribute('aria-selected',String(who!=='all'));t.querySelector('.wi').textContent=mine?'🙋':'👥';t.title=mine?'Creados por mí (toca otra vez: mi equipo)':'Creados por mi equipo (toca otra vez: solo míos)';t.setAttribute('aria-label',mine?'Creados por mí':'Creados por mi equipo');t.querySelector('.wcount').textContent=cnt(w)||''}
function pickWho(w){if(w!=='all'){lastMine=w;try{localStorage.setItem('scoutLastMine',w)}catch{}}who=w;try{localStorage.setItem('scoutWho',who)}catch{}draw()}
phoneQ.addEventListener('change',()=>setView(phoneQ.matches?view:'list'));
function toList(id){if(phoneQ.matches)setView('list');const c=$(`#list [data-id="${CSS.escape(id)}"]`);if(c){c.scrollIntoView({block:'center',behavior:'smooth'});c.classList.remove('flash');void c.offsetWidth;c.classList.add('flash')}}
document.addEventListener('click',e=>{const wt=e.target.closest('#mainTabs [data-who]');if(wt){if(wt.hasAttribute('data-whotoggle')&&who!=='all')return pickWho(who==='mine'?'team':'mine');return pickWho(wt.dataset.who)}if(e.target.closest('#mview'))return setView(view==='map'?'list':'map');const u=e.target.closest('[data-update]');if(u)return openUpdate(u.dataset.update);const ck=e.target.closest('[data-check]');if(ck)return openView(ck.dataset.check);const tl=e.target.closest('[data-tolist]');if(tl){e.preventDefault();map?.closePopup();return toList(tl.dataset.tolist)}const m=e.target.closest('[data-onmap]');if(m)return focusMap(m.dataset.onmap);const bk=e.target.closest('[data-pvback]');if(bk)return leaveView();const pm=e.target.closest('[data-pvmap]');if(pm){mapAfter=pm.dataset.pvmap;return leaveView()}});
function focusMap(id){if(phoneQ.matches)setView('map');const p=points.find(x=>x.id===id);if(p&&map){map.setView(p.coords,16);layer.eachLayer(l=>{if(l._pid===p.id)l.openPopup()})}}
addEventListener('popstate',route);
// Al volver con Atrás desde Command o la ficha pública (página guardada por el navegador), recarga los datos.
addEventListener('pageshow',e=>{if(e.persisted)load()});
$('#who').addEventListener('change',e=>pickWho(e.target.value));
$('#find').addEventListener('input',draw);
async function load(){let r;try{r=await fetch('/api/full/scout',{credentials:'same-origin',cache:'no-store'})}catch{$('#list').innerHTML='<p class="empty">Sin conexión. Vuelve a intentarlo.</p>';showApp();return}if(r.status===401){$('#gateWrap').hidden=false;$('#gate').hidden=false;$('#app').hidden=true;$('#mnav').hidden=true;return}points=await r.json().catch(()=>[]);if(!load.me){load.me=1;try{const m=await (await fetch('/api/full/me',{credentials:'same-origin',cache:'no-store'})).json();myTeam=m.team||'';canEdit=(m.roles||[]).includes('agent')||(m.panels||[]).some(x=>x.url==='/command.html')}catch{}}$('#noTeam').hidden=!!myTeam;showApp();route()}
function showApp(){$('#gateWrap').hidden=true;$('#app').hidden=false;$('#mnav').hidden=false}
window.AppNav?.watchAccess('/api/full/me',null);
load();
</script></body></html>
