// Ubicación en vivo: punto azul que se mueve mientras manejas; el mapa la sigue salvo que lo hayas movido hace poco.
// Tu ubicación es una camioneta (pickup); mira hacia la izquierda o la derecha según hacia dónde vas.
const truckIcon='<div class="truckpin"><svg viewBox="0 0 32 20" width="42" height="26" aria-hidden="true"><path d="M2 9h13V4h6.5l3.5 5h4.5a1.5 1.5 0 0 1 1.5 1.5V15H2z" fill="#1f6fd1" stroke="#fff" stroke-width="1.5" stroke-linejoin="round"/><path d="M17 5.6h4l2.6 3.4H17z" fill="#d6e7ff"/><path d="M2 9h13" stroke="#fff" stroke-width="1"/><circle cx="8" cy="15.5" r="3" fill="#173542" stroke="#fff" stroke-width="1.5"/><circle cx="24.5" cy="15.5" r="3" fill="#173542" stroke="#fff" stroke-width="1.5"/></svg></div>';
function faceTruck(heading){const el=meMarker?.getElement()?.querySelector('.truckpin');if(el&&Number.isFinite(heading))el.classList.toggle('west',heading>180&&heading<360)}
// Mientras está en vivo, la posición se comparte solo con tu equipo (la ven en sus mapas los de tu equipo que entraron con código):
// cada 15 s, o antes si se movió 50 m o más. Al apagarla o salir se deja de compartir.
// Antes de compartir hace falta aceptar el aviso de ubicación (PointForm.locationNotice); locConsent viene de la sesión.
// Si el servidor responde 428 (aviso nuevo o no aceptado) se apaga y se vuelve a pedir al activarla.
let sharedAt=0,sharedPos=null,lastFix=null,locConsent=false;
function shareLocation(p){lastFix=p;if(agentMode||!csrf)return;const here=[p.coords.latitude,p.coords.longitude];if(sharedPos&&Date.now()-sharedAt<15000&&(!map||map.distance(sharedPos,here)<50))return;sharedAt=Date.now();sharedPos=here;api('/api/runner/location','POST',{lat:here[0],lon:here[1],accuracy:Math.round(p.coords.accuracy||0)}).catch(err=>{if(err.status===428){locConsent=false;stopLive();flash('Acepta el aviso de ubicación para volver a compartirla.');render()}})}
function setLiveButton(on){setTimeout(syncFollowBtn);$('#liveLoc').setAttribute('aria-pressed',on?'true':'false');$('#liveLoc').textContent=on?(agentMode?'📍 En vivo · tocar para apagar':'📍 En vivo · compartida con el equipo'):'📍 Mi ubicación en vivo';$('#liveLoc').title=on?'Tocar para apagar':''}
// startLive pide el aviso si falta (los agentes no comparten su ubicación, así que no lo necesitan); devuelve si quedó activa.
async function startLive(){if(!map)return false;if(!agentMode&&!locConsent){if(!await PointForm.locationNotice())return false;try{await api('/api/runner/location/consent','POST',{accept:true});locConsent=true}catch(err){flash('No se pudo guardar la aceptación: '+err.message);render();return false}}startLiveNow();return watchId!==null}
function startLiveNow(){if(!map)return;if(!navigator.geolocation){flash('Este dispositivo no permite compartir la ubicación.');render();return}localStorage.setItem('runnerLive','1');setLiveButton(true);let first=true;setFollow(true);watchId=navigator.geolocation.watchPosition(p=>{me=[p.coords.latitude,p.coords.longitude];shareLocation(p);if(!meMarker){meMarker=L.marker(me,{icon:L.divIcon({className:'',html:truckIcon,iconSize:[42,28],iconAnchor:[21,14]}),zIndexOffset:2000,interactive:false,title:'Tu ubicación'}).addTo(map);meCircle=L.circle(me,{radius:p.coords.accuracy,color:'#1f6fd1',weight:1,fillOpacity:.08,interactive:false}).addTo(map)}else{meMarker.setLatLng(me);meCircle.setLatLng(me).setRadius(p.coords.accuracy)}faceTruck(p.coords.heading);drawRoute();syncFollowBtn();if(!follow){first=false;return}if(first){first=false;const pts=[me,...mine.filter(hasCoords).map(n=>n.camp.coords)];if(pts.length>1)map.fitBounds(pts,{padding:[40,40],maxZoom:15});else map.setView(me,15)}else if(Date.now()-lastPan>15000&&!map.getBounds().pad(-0.2).contains(me))map.panTo(me)},err=>{// Sin señal o se tardó (códigos 2 y 3): el GPS sigue intentando; solo se apaga si se negó el permiso.
if(err.code!==1)return;stopLive();flash('Permite el acceso a tu ubicación para verla en el mapa.');render()},{enableHighAccuracy:true,maximumAge:5000,timeout:30000})}
// Quieto, el teléfono deja de avisar posiciones nuevas: se reenvía la última cada 20 s para no desaparecer del mapa a los 2 min.
setInterval(()=>{if(watchId!==null&&lastFix)shareLocation(lastFix)},20000);
function stopLive(){if(watchId!==null)navigator.geolocation.clearWatch(watchId);if(sharedPos&&csrf&&!agentMode)api('/api/runner/location/stop','POST',{}).catch(()=>{});sharedAt=0;sharedPos=null;lastFix=null;watchId=null;localStorage.removeItem('runnerLive');me=null;[meMarker,meCircle].forEach(m=>m&&map.removeLayer(m));meMarker=meCircle=null;setLiveButton(false);drawRoute()}
$('#liveLoc').onclick=()=>watchId===null?startLive():stopLive();
// Por defecto, al entrar se le pide al corredor activar su ubicación en vivo (una vez por carga; «Ahora no» vale hasta cerrar la pestaña).
// No a los agentes (no comparten) ni si ya está en vivo. Activar llama a startLive y el navegador pide el permiso si hace falta.
// Quien entró con código ve solo a los corredores de su equipo con ubicación en vivo como camionetas naranjas (como en el mapa público),
// con nombre y hace cuánto en la etiqueta; se actualiza cada 15 s y se quitan al salir.
const runnerTruck='<div class="runnertruck"><svg viewBox="0 0 32 20" width="28" height="18" aria-hidden="true"><path d="M2 9h13V4h6.5l3.5 5h4.5a1.5 1.5 0 0 1 1.5 1.5V15H2z" fill="#ed7654" stroke="#fff" stroke-width="1.8" stroke-linejoin="round"/><path d="M17 5.6h4l2.6 3.4H17z" fill="#ffe3d6"/><circle cx="8" cy="15.5" r="3" fill="#173542" stroke="#fff" stroke-width="1.5"/><circle cx="24.5" cy="15.5" r="3" fill="#173542" stroke="#fff" stroke-width="1.5"/></svg></div>';
const agoText=sec=>sec<60?`hace ${sec} s`:`hace ${Math.round(sec/60)} min`,teamPins=new Map();
async function loadTeam(){if(!map)return;let list=[];if(csrf&&localStorage.getItem('runnerCode')){try{const r=await fetch('/api/runner/team',{cache:'no-store',credentials:'same-origin'});if(r.ok)list=await r.json()}catch{}}const seen=new Set();for(const x of list){seen.add(x.id);const tip=`🚚 ${clean(x.name)} · ${agoText(x.seconds)}`;let pin=teamPins.get(x.id);if(pin){pin.setLatLng([x.lat,x.lon]);pin.setTooltipContent(tip)}else{pin=L.marker([x.lat,x.lon],{icon:L.divIcon({className:'',html:runnerTruck,iconSize:[28,18],iconAnchor:[14,9]}),zIndexOffset:1500,keyboard:false,title:x.name}).bindTooltip(tip,{direction:'top',offset:[0,-8]}).addTo(map);teamPins.set(x.id,pin)}}for(const [id,pin] of teamPins)if(!seen.has(id)){map.removeLayer(pin);teamPins.delete(id)}}

let liveOffered=false;

async function offerLive(){resumeLive();if(!map||agentMode||!csrf||watchId!==null||liveOffered||sessionStorage.getItem('runnerLiveAsked'))return;liveOffered=true;const denied=await navigator.permissions?.query({name:'geolocation'}).then(p=>p.state==='denied',()=>false);if(watchId!==null)return;if(!locConsent&&!denied){if(!await startLive())sessionStorage.setItem('runnerLiveAsked','1');return}if(await askConfirm('¿Activar tu ubicación en vivo?',{yes:'📍 Activar',no:'Ahora no',detail:denied?'Tu navegador tiene bloqueada la ubicación para esta página: permítela en los ajustes del navegador y vuelve a tocar «📍 Mi ubicación en vivo».':'Tu equipo te verá en el mapa y la ruta al próximo punto sale desde donde estás. Puedes apagarla cuando quieras con el botón del mapa.'})){if(watchId===null)startLive()}else sessionStorage.setItem('runnerLiveAsked','1')}
if(map)map.on('dragstart',()=>{lastPan=Date.now();setFollow(false)});else $('#liveLoc').hidden=true;

(async()=>{const r=await fetch('/api/runner/session',{credentials:'same-origin',cache:'no-store'}).catch(()=>null);if(r&&r.ok){const s=await r.json();csrf=s.csrf;runnerName=s.name;agentMode=!!s.agent;locConsent=!!s.locationConsent;showUserId(s.id);$('#who').hidden=false;$('#whoName').textContent=(window.AppNav?AppNav.shortName(runnerName):runnerName);$('#whoName').title=runnerName;syncPublicNav();await refresh();loadTeam();return offerLive()}if(await relogin()){await refresh();loadTeam();return offerLive()}showGate()})();

async function sendPoint(record){const post=url=>fetch(url,{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(record)}),code=localStorage.getItem('runnerCode');if(code){let r=await post('/api/full/points');if(r.status===401){const ok=await fetch('/api/session/code',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify({accessCode:code})}).then(x=>x.ok).catch(()=>false);if(ok)r=await post('/api/full/points')}if(r.status!==401)return r}return post('/api/submissions')}
$('#addForm').onsubmit=async e=>{e.preventDefault();const record=PointForm.values($('#addFields'));if(!PointForm.hasPhone(record)){$('#addMsg').textContent='Agrega al menos un contacto con teléfono (7 dígitos o más).';$('#addFields [name="coordinatorPhone"]')?.focus();return}const bs=[...e.target.querySelectorAll('[type=submit]')];bs.forEach(b=>b.disabled=true);$('#addMsg').textContent='Guardando…';try{const out=await PointForm.sendOrQueue(record,sendPoint);if(out.queued){$('#addSentTitle').textContent='Sin conexión: el punto quedó guardado en este teléfono y se enviará solo cuando haya internet. Sus datos también se copiaron al portapapeles.';$('#addForm').hidden=true;$('#addSent').hidden=false;return}const r=out.res,saved=await r.json().catch(()=>({}));if(!r.ok)throw Error(saved.error||'Error HTTP '+r.status);$('#addSentTitle').textContent=saved.status==='approved'?'Punto publicado. Ya aparece en el mapa.':'Se envió el punto. Queda por revisar antes de publicarse.';$('#addForm').hidden=true;$('#addSent').hidden=false;refresh()}catch(err){$('#addMsg').textContent='No se pudo guardar: '+err.message}finally{bs.forEach(b=>b.disabled=false)}};

<script>
// Confirmación con Sí / No (completar o dejar una carrera); muestra el punto y las necesidades de la carrera.
// media:true agrega «fotos o videos de la entrega» (opcional); los elegidos quedan en confirmFiles.
// En el teléfono, «Tomar foto» y «Grabar video» abren la cámara trasera (capture); «Galería» elige archivos.
// Se pueden agregar varios antes de completar; cada uno se ve como miniatura y se puede quitar con ✕.
let confirmFiles=[],confirmURLs=[];
function drawConfirmFiles(){confirmURLs.forEach(URL.revokeObjectURL);confirmURLs=confirmFiles.map(f=>URL.createObjectURL(f));$('#confirmFiles').innerHTML=confirmFiles.map((f,i)=>`<figure class="pf-thumb"><span class="pickthumb">${f.type.startsWith('image/')?`<img src="${confirmURLs[i]}" alt="">`:f.type.startsWith('video/')?`<video src="${confirmURLs[i]}#t=0.1" muted playsinline preload="metadata"></video><span class="playmark">▶</span>`:'<span class="pf-thumb-icon">📷</span>'}</span><button type="button" class="unpick" data-unpick="${i}" aria-label="Quitar ${clean(f.name)}">✕</button></figure>`).join('')}
// pickFiles abre la cámara (foto o video) o la galería y devuelve los archivos elegidos. Android abre su selector de
// fotos (sin cámara) si el campo no pide cámara, por eso cámara y galería son botones separados.
function pickFiles(id){return new Promise(resolve=>{const input=document.getElementById(id);input.value='';input.onchange=()=>resolve([...input.files]);input.click()})}
document.addEventListener('click',e=>{const b=e.target.closest('[data-pick]');if(!b)return;const files=pickFiles(b.dataset.pick);if(b.closest('#confirmDialog')){files.then(f=>{confirmFiles.push(...f);drawConfirmFiles()});return}const target=mediaTarget;$('#pickDialog').close();files.then(f=>{if(target&&f.length)(roOn?roStoreMedia(target,'pickup',f):uploadRunMedia(target,'pickup',f))})});
$('#confirmFiles').onclick=e=>{const b=e.target.closest('[data-unpick]');if(b){confirmFiles.splice(Number(b.dataset.unpick),1);drawConfirmFiles()}};
// packing:true (al completar) muestra lo que se entrega según la lista de empaque, para revisarlo antes de confirmar.
function askConfirm(text,{yes='Sí',no='No',detail='',danger=false,need=null,media=false,packing=false}={}){const d=$('#confirmDialog');confirmFiles=[];drawConfirmFiles();$('#confirmMedia').hidden=!media;$('#confirmText').textContent=text;$('#confirmNeed').innerHTML=need?`<div class="confirmcamp">${clean(need.camp.code)} · ${clean(need.camp.area)}</div>${needChips(need.need)}${packing?`<div class="confirmpack"><b>📦 Lo que entregas</b>${(need.packing||[]).length?PointForm.packingHtml(need.packing):'<p class="muted">Sin lista de empaque.</p>'}</div>`:''}`:'';$('#confirmDetail').textContent=detail;$('#confirmDetail').hidden=!detail;$('#confirmYes').textContent=yes;$('#confirmYes').classList.toggle('danger',danger);$('#confirmNo').textContent=no;d.returnValue='';d.showModal();$('#confirmNo').focus();return new Promise(resolve=>d.addEventListener('close',()=>{resolve(d.returnValue==='yes');setTimeout(()=>{confirmURLs.forEach(URL.revokeObjectURL);confirmURLs=[]},60000)},{once:true}))}
// Fotos y videos de la carrera: «Foto de partida» al recoger y, al completar, los de la entrega (desde el diálogo de confirmación).
// En el teléfono el selector ofrece cámara o galería; en computadora, archivos.
let mediaTarget=null,uploading=false,mediaOn=false;
// Sin almacenamiento de fotos en el servidor no se muestran los botones para subir (solo un aviso).
fetch('/api/media/status',{cache:'no-store'}).then(r=>r.json()).then(s=>{mediaOn=!!s.enabled;if(csrf)render()}).catch(()=>{});
const mediaSrc=n=>m=>'/api/runner/media/'+encodeURIComponent(n.id)+'/'+encodeURIComponent(m.id);
function mediaStrip(n){const m=n.media||[];return ['pickup','delivery'].map(st=>{const g=m.filter(x=>x.stage===st);return g.length?`<div class="runmedia"><b>${st==='pickup'?'Fotos de partida':'Fotos de entrega'} (${g.length})</b><div class="thumbs">${PointForm.mediaThumbs(g,mediaSrc(n))}${st==='pickup'&&mediaOn?`<button type="button" class="thumbadd" data-media="${clean(n.id)}" aria-label="Agregar otra foto o video de partida" title="Agregar otra foto o video de partida">+</button>`:''}</div></div>`:''}).join('')}
async function uploadRunMedia(id,stage,files){const status=$('#up-'+CSS.escape(id))||$('#message');uploading=true;let ok=0;try{for(const [i,original] of [...files].entries()){const file=await PointForm.prepareMedia(original);const label=`Subiendo ${stage==='pickup'?'foto de partida':'entrega'} ${i+1} de ${files.length}`;status.textContent=label+'…';try{await PointForm.uploadMedia('/api/runner/needs/'+encodeURIComponent(id)+'/media?stage='+stage,file,{csrf,onProgress:p=>status.textContent=`${label}… ${Math.round(p*100)}%`});ok++}catch(err){status.textContent=`No se pudo subir «${original.name}»: ${err.message}`;return false}}return true}finally{uploading=false;if(ok){await refresh();flash(`${ok} ${ok===1?'archivo guardado':'archivos guardados'} (${stage==='pickup'?'partida':'entrega'}).`);render()}}}
// Lista de empaque: el diálogo es compartido (PointForm.openPacking); aquí se carga el catálogo y se guarda.
const packIcon=name=>typeof PointForm!=='undefined'?PointForm.packIcon(name):'';
function packButton(n){return `<button class="btn plain pack" type="button" data-pack="${clean(n.id)}" title="Agregar a lista de empaque">${packIcon('')}Lista de empaque</button>`}
async function openPacking(id){const n=findNeed(id);if(!n)return;let items;try{items=await api('/api/runner/packing-items')}catch(err){flash(err.message);render();return}PointForm.openPacking({need:n.need,packed:n.packing,subtitle:`${n.camp.code} · ${n.camp.area}`,items,save:async lines=>{await api('/api/runner/needs/'+encodeURIComponent(n.id)+'/packing','POST',{items:lines});await refresh();flash(`Lista de empaque guardada (${lines.length} ${lines.length===1?'artículo':'artículos'}).`);render()}})}

// Sin señal en pleno recorrido: si tienes carreras en camino y se pierde la conexión, una pantalla cubre la página y te
// deja solo tu recorrido. Ahí puedes tomar fotos de partida y marcar «Completé» (con fotos de entrega); todo queda en el
// teléfono (IndexedDB) y se envía en orden (fotos antes de completar) cuando vuelve la señal. No se sale hasta enviarlo todo.
let roOn=false,roChecking=false,roDb=null;
const roOpen=()=>roDb||(roDb=new Promise((res,rej)=>{const q=indexedDB.open('runnerOffline',1);q.onupgradeneeded=()=>q.result.createObjectStore('outbox',{keyPath:'key',autoIncrement:true});q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)}));
const roReq=(mode,op)=>roOpen().then(db=>new Promise((res,rej)=>{const r=op(db.transaction('outbox',mode).objectStore('outbox'));r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}));
const roAdd=v=>roReq('readwrite',st=>st.add(v)),roAll=()=>roReq('readonly',st=>st.getAll()).catch(()=>[]),roDel=k=>roReq('readwrite',st=>st.delete(k)),roPut=v=>roReq('readwrite',st=>st.put(v));
document.body.insertAdjacentHTML('beforeend','<div id="runOffline" class="ro" role="dialog" aria-modal="true" aria-labelledby="roTitle" hidden><div class="ro-head"><span class="ro-dot" aria-hidden="true"></span><h2 id="roTitle">Sin señal · Tu recorrido</h2><span class="ro-badge" id="roBadge" title="Por enviar">0</span></div><div class="ro-body" id="roBody"></div><div class="ro-foot"><p class="ro-status" id="roStatus" role="status"></p><button type="button" class="ro-go" data-ro="check">Reintentar envío</button></div></div>');
const roLock=on=>['header.top','.mobile-nav','main.app'].forEach(sel=>{const el=document.querySelector(sel);if(el)el.inert=on});
function enterRunOffline(){if(agentMode||!mine.length||roOn||document.querySelector('#pfOffline:not([hidden])'))return;roOn=true;$('#runOffline').hidden=false;roLock(true);drawRunOffline('Sin conexión. Sigue con tu recorrido: lo que hagas aquí se envía cuando vuelva la señal.')}
function leaveRunOffline(msg){roOn=false;$('#runOffline').hidden=true;roLock(false);if(msg){const t=document.createElement('div');t.className='ro-toast';t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),4000)}refresh()}
async function drawRunOffline(status){const out=await roAll();$('#roBadge').textContent=out.length;if(status!==undefined)$('#roStatus').textContent=status;
$('#roBody').innerHTML=`<p class="ro-intro">Las llamadas funcionan sin datos. Fotos y carreras completadas quedan guardadas en este teléfono hasta que haya señal.</p>`+mine.map((n,i)=>{const c=n.camp,items=out.filter(x=>x.needId===n.id),photos=items.filter(x=>x.kind==='media'),done=items.some(x=>x.kind==='complete'),bad=items.filter(x=>x.error),link=locationLink(c);return `<article class="ro-card${done?' done':''}"><div class="ro-top"><span class="runnum">${i+1}</span><b>${clean(c.area||c.code)}</b>${done?'<span class="ro-tag">✓ Completada · por enviar</span>':''}</div>${needChips(n.need)}${c.place||c.directions?`<p class="ro-where">📍 ${clean([c.place,c.directions].filter(Boolean).join(' · '))}</p>`:''}${(c.contacts||[]).map(x=>`<a class="ro-call" href="tel:${clean(String(x.phone).replace(/[^\d+]/g,''))}">📞 ${clean(String(x.name||'').replace(/\s*\(coordinador\)\s*/i,' (coord.)'))} ${clean(x.phone)}</a>`).join('')}${link?`<a class="ro-map" href="${clean(link.url)}" target="_blank" rel="noopener noreferrer">${clean(link.label.replace(' ↗',''))}</a>`:''}${photos.length?`<p class="ro-pend">📷 ${photos.length} ${photos.length===1?'foto':'fotos'} por enviar</p>`:''}${bad.map(x=>`<p class="ro-err">No se pudo enviar ${x.kind==='media'?'una foto':'«completada»'}: ${clean(x.error)} <button type="button" data-ro="drop" data-key="${x.key}">Quitar</button></p>`).join('')}${done?'':`<div class="ro-acts">${mediaOn?`<button type="button" data-ro="photo" data-id="${clean(n.id)}">📷 Foto de partida</button>`:''}<button type="button" class="go" data-ro="done" data-id="${clean(n.id)}">✓ Completé</button></div>`}</article>`}).join('')}
async function roStoreMedia(needId,stage,files){for(const f of files){const file=await PointForm.prepareMedia(f);await roAdd({kind:'media',needId,stage,file,name:file.name||f.name||'foto',at:Date.now()})}drawRunOffline(`${files.length} ${files.length===1?'foto guardada':'fotos guardadas'} en el teléfono.`)}
// Envía lo guardado en orden; se detiene sin red. Devuelve cuántos se enviaron.
async function roFlush(){let sent=0;for(const x of (await roAll()).sort((a,b)=>a.key-b.key)){if(x.error)continue;try{if(x.kind==='media'){const up=()=>PointForm.uploadMedia('/api/runner/needs/'+encodeURIComponent(x.needId)+'/media?stage='+x.stage,x.file,{csrf});try{await up()}catch(err){if(err.status===401&&await relogin())await up();else throw err}}else await api('/api/runner/needs/'+encodeURIComponent(x.needId)+'/complete','POST');await roDel(x.key);sent++}catch(err){if(!err.status||err.status>=500)break;x.error=err.message||('Error HTTP '+err.status);await roPut(x)}}return sent}
async function checkRun(){if(roChecking)return;roChecking=true;drawRunOffline('Intentando enviar…');const ok=await fetch('/health',{cache:'no-store'}).then(r=>r.ok).catch(()=>false);if(!ok){roChecking=false;drawRunOffline('Todavía sin señal. Intenta de nuevo en un momento.');return}const sent=await roFlush();roChecking=false;const left=await roAll();if(!left.length){leaveRunOffline(sent?`Conectado: se ${sent===1?'envió 1 cosa':`enviaron ${sent} cosas`} (fotos y carreras).`:'Conectado.');return}drawRunOffline(left.some(x=>x.error)?'Algo no se pudo enviar: revisa los avisos en rojo.':'Todavía sin señal. Intenta de nuevo en un momento.')}
$('#runOffline').addEventListener('click',async e=>{const b=e.target.closest('[data-ro]');if(!b)return;const act=b.dataset.ro;
if(act==='check'){checkRun();return}
if(act==='drop'){if(confirm('¿Quitar esto? No se enviará.')){await roDel(Number(b.dataset.key));drawRunOffline()}return}
if(act==='photo'){mediaTarget=b.dataset.id;$('#pickDialog').showModal();return}
if(act==='done'){const n=findNeed(b.dataset.id);if(!n||!await askConfirm('¿Completaste esta carrera?',{yes:'Sí, completar',need:n,media:mediaOn,packing:true,detail:'Sin señal: se guarda en el teléfono y se envía cuando vuelva la conexión.'}))return;if(confirmFiles.length)await roStoreMedia(n.id,'delivery',[...confirmFiles]);await roAdd({kind:'complete',needId:n.id,at:Date.now()});drawRunOffline('Carrera marcada como completada. Se enviará cuando haya señal.')}});
addEventListener('offline',()=>enterRunOffline());
addEventListener('online',()=>{if(roOn)checkRun();else roAll().then(l=>{if(l.length)roFlush().then(n=>{if(n)refresh()})})});
// Al abrir la página: si quedó algo guardado, se envía (o, sin señal, vuelve la pantalla del recorrido).
setTimeout(()=>roAll().then(l=>{if(!l.length)return;if(navigator.onLine)roFlush().then(n=>{if(n)refresh()});else enterRunOffline()}),2500);

// Acceso al día (nav.js): roles nuevos al menú; sin acceso a esta página, al inicio.
window.AppNav?.watchAccess('/api/runner/session','/runner.html');
</script></body></html>
