<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curación · Azuero</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#173542;font:16px system-ui,-apple-system,sans-serif}header{background:#10263a;color:white;padding:18px 24px;font-weight:800}main{max-width:850px;margin:30px auto;padding:0 18px}h1{font-size:26px}form,article{background:#fff;padding:20px;border:1px solid #dce5e4;border-radius:12px;margin:15px 0}input{width:100%;padding:12px;border:1px solid #cad9d9;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;background:#19745f;color:white;margin:8px 8px 0 0}button.reject{background:#9a4536}small,.muted{color:#677c83}article p{white-space:pre-line;overflow-wrap:anywhere}#error{color:#a33527}</style></head><body><header>AZUERO / CURACIÓN</header><main><h1>Solicitudes pendientes</h1><form id="login"><label>Contraseña maestra<input type="password" name="password" autocomplete="current-password" required></label><button>Entrar</button><p id="error"></p></form><div id="queue" hidden><p class="muted">Solo las solicitudes aprobadas aparecen en el mapa.</p><div id="items"></div><button id="logout" class="reject">Salir</button></div></main><script>
let csrf='';const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function load(){if(!csrf){const session=await fetch('/api/admin/session',{cache:'no-store'});if(session.ok)csrf=(await session.json()).csrf}const r=await fetch('/api/admin/submissions',{cache:'no-store'});if(!r.ok){document.querySelector('#queue').hidden=true;document.querySelector('#login').hidden=false;return}const rows=await r.json();document.querySelector('#login').hidden=true;document.querySelector('#queue').hidden=false;document.querySelector('#items').innerHTML=rows.length?rows.map(p=>`<article><small>${clean(new Date(p.created).toLocaleString('es-PA'))} · ${clean(p.id.slice(0,8))}</small><h2>${clean(p.code)} · ${clean(p.area)}</h2><p>${clean(p.place||'Sin referencia')} · ${clean(p.people||'—')} personas</p><p><strong>Necesidades:</strong> ${clean(p.needs||'Sin datos')}</p><p>GPS: ${p.coords?clean(p.coords.join(', ')):'Sin GPS'}</p><button data-id="${clean(p.id)}" data-decision="approved">Aprobar</button><button class="reject" data-id="${clean(p.id)}" data-decision="rejected">Rechazar</button></article>`).join(''):'<p>No hay solicitudes pendientes.</p>'}
document.querySelector('#login').onsubmit=async e=>{e.preventDefault();const input=e.target.elements.password;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});input.value='';if(!r.ok){document.querySelector('#error').textContent='Contraseña incorrecta o demasiados intentos.';return}csrf=(await r.json()).csrf;document.querySelector('#error').textContent='';load()};
document.querySelector('#items').onclick=async e=>{const b=e.target.closest('button[data-decision]');if(!b)return;b.disabled=true;const r=await fetch('/api/admin/decisions',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({id:b.dataset.id,decision:b.dataset.decision})});if(!r.ok){alert('No se pudo procesar. Vuelve a entrar.');b.disabled=false;return}load()};document.querySelector('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'});csrf='';location.reload()};load();
</script></body></html>
