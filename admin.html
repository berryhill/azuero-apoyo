<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Curación · Azuero</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6f5;color:#173542;font:16px system-ui,-apple-system,sans-serif}header{background:#10263a;color:white;padding:18px 24px;font-weight:800}main{max-width:1000px;margin:25px auto;padding:0 18px}h1{font-size:26px;margin:0 0 8px}form,article{background:#fff;padding:20px;border:1px solid #dce5e4;border-radius:12px;margin:12px 0}input{width:100%;padding:12px;border:1px solid #cad9d9;border-radius:8px;font:inherit}button{border:0;border-radius:8px;padding:11px 15px;font:inherit;font-weight:700;cursor:pointer;background:#19745f;color:white;margin:8px 8px 0 0}button.reject{background:#9a4536}button.active{background:#10263a}small,.muted{color:#677c83}article p{white-space:pre-line;overflow-wrap:anywhere;line-height:1.45}article h2{margin:8px 0}#error{color:#a33527}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:8px 16px}.field{font-size:13px;overflow-wrap:anywhere}.field b{display:block;color:#617780;font-size:11px;text-transform:uppercase;margin-bottom:3px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input{max-width:280px;margin-top:8px}.status{display:inline-block;border-radius:20px;padding:4px 9px;background:#e8f3ee;color:#1c6a51;font-size:12px;font-weight:700}.status.pending{background:#fff0e8;color:#ae4f32}.status.rejected{background:#f6e6e4;color:#9a4536}</style></head><body><header>AZUERO / CURACIÓN</header><main><h1>Panel de curación</h1><form id="login"><label>Contraseña maestra<input type="password" name="password" autocomplete="current-password" required></label><button>Entrar</button><p id="error"></p></form><section id="dashboard" hidden><p class="muted">Datos completos del registro, incluidos contactos. No compartas esta página ni sus capturas públicamente.</p><div class="toolbar"><button id="pendingTab">Pendientes</button><button id="allTab" class="active">Todos los puntos</button><input id="search" placeholder="Buscar código, zona o contacto…" aria-label="Buscar puntos"><button id="logout" class="reject">Salir</button></div><p id="count" class="muted"></p><div id="items"></div><form id="changePassword"><h2>Cambiar contraseña maestra</h2><label>Nueva contraseña (12–72 caracteres)<input type="password" name="newPassword" minlength="12" maxlength="72" autocomplete="new-password" required></label><button type="submit">Guardar contraseña</button><p id="passwordMessage"></p></form></section></main><script>
let csrf='',points=[],view='all';const $=s=>document.querySelector(s);const clean=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const labels={row:'N.º fila',ordinal:'Orden',code:'Código',area:'Área',place:'Ubicación',needs:'Necesidades',notes:'Notas del grupo',directions:'Dirección',coordinator:'Coordinador',contact:'Contacto principal',phone:'Teléfono',people:'Personas',adults:'Adultos',children:'Niños',babies:'Bebés',olderAdults:'Adultos mayores',disabled:'Con discapacidad',secondContact:'Segundo contacto',secondPhone:'Segundo teléfono',thirdContact:'Tercer contacto',thirdPhone:'Tercer teléfono',service:'Servicio reportado',serviceNotes:'Notas de servicio',generator:'Generador',gps:'Enlace de Google Maps',extra:'Otras notas'};
function render(){const q=$('#search').value.toLocaleLowerCase().trim();const rows=points.filter(p=>(view==='pending'?p.status==='pending':p.status!=='rejected')&&Object.values(p).join(' ').toLocaleLowerCase().includes(q)).sort((a,b)=>view==='pending'?Date.parse(b.created)-Date.parse(a.created):a.code.localeCompare(b.code));$('#count').textContent=`${rows.length} ${view==='pending'?'solicitudes pendientes':'puntos registrados'}`;$('#items').innerHTML=rows.length?rows.map(p=>`<article><small>${p.source==='sheet'?'Registro importado':clean(new Date(p.created).toLocaleString('es-PA'))}</small><h2>${clean(p.code)} · ${clean(p.area)} <span class="status ${clean(p.status)}">${clean(p.status)}</span></h2><div class="grid">${Object.entries(labels).map(([k,label])=>p[k]?`<div class="field"><b>${label}</b>${k==='gps'&&/^https:\/\/maps\.(google\.com|app\.goo\.gl)/.test(p[k])?`<a href="${clean(p[k])}" target="_blank" rel="noopener noreferrer">Abrir mapa ↗</a>`:clean(p[k])}</div>`:'').join('')}</div>${p.status==='pending'?`<div><button data-id="${clean(p.id)}" data-decision="approved">Aprobar</button><button class="reject" data-id="${clean(p.id)}" data-decision="rejected">Rechazar</button></div>`:''}</article>`).join(''):'<p>No hay puntos en esta vista.</p>'}
async function load(){if(!csrf){const s=await fetch('/api/admin/session',{cache:'no-store'});if(s.ok)csrf=(await s.json()).csrf}const r=await fetch('/api/admin/points',{cache:'no-store'});if(!r.ok){$('#dashboard').hidden=true;$('#login').hidden=false;return}points=await r.json();$('#login').hidden=true;$('#dashboard').hidden=false;render()}
$('#login').onsubmit=async e=>{e.preventDefault();const input=e.target.elements.password;const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:input.value})});input.value='';if(!r.ok){$('#error').textContent='Contraseña incorrecta o demasiados intentos.';return}csrf=(await r.json()).csrf;$('#error').textContent='';load()};$('#pendingTab').onclick=()=>{view='pending';$('#pendingTab').classList.add('active');$('#allTab').classList.remove('active');render()};$('#allTab').onclick=()=>{view='all';$('#allTab').classList.add('active');$('#pendingTab').classList.remove('active');render()};$('#search').oninput=render;
$('#items').onclick=async e=>{const b=e.target.closest('button[data-decision]');if(!b)return;b.disabled=true;const r=await fetch('/api/admin/decisions',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({id:b.dataset.id,decision:b.dataset.decision})});if(!r.ok){alert('No se pudo procesar. Vuelve a entrar.');b.disabled=false;return}load()};$('#logout').onclick=async()=>{await fetch('/api/admin/logout',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:'{}'});csrf='';location.reload()};$('#changePassword').onsubmit=async e=>{e.preventDefault();const input=e.target.elements.newPassword;const password=input.value;input.value='';const r=await fetch('/api/admin/password',{method:'POST',headers:{'Content-Type':'application/json','X-CSRF-Token':csrf},body:JSON.stringify({password})});if(!r.ok){$('#passwordMessage').textContent='No se pudo cambiar la contraseña.';return}csrf='';$('#passwordMessage').textContent='Contraseña cambiada. Inicia sesión de nuevo.';$('#dashboard').hidden=true;$('#login').hidden=false};load();
</script></body></html>
